(self.__next_f=self.__next_f||[]).push([0]);self.__next_f.push([2,null])</script><script>self.__next_f.push([1,"1:HL[\"/_next/static/css/95f2ab1de499c91f.css\",\"style\"]\n"])</script><script>self.__next_f.push([1,"2:I[12846,[],\"\"]\n4:I[12143,[\"404\",\"static/chunks/app/blog/page-d27b5e096bb686b8.js\"],\"default\"]\n9:I[4707,[],\"\"]\na:I[36423,[],\"\"]\nc:I[61060,[],\"\"]\n5:T5b6f,"])</script><script>self.__next_f.push([1,"\n# 花生13（四海公考）判断推理模块学习笔记\n\n---\n\n## 一、图形推理\n\n### 1.1 基本思路与考场策略\n\n**考场思维**：图推容易陷入自己世界不自知，时间悄然流逝。建议实战中图推分两至三次完成：\n\n- 第一轮：花3~4分钟把3~5道简单题搞定\n    \n- 第二轮：回头花2~3分钟看剩余图推\n    \n- 第三轮：涂卡时再看剩余题目，常有\"灵光乍现\"\n    \n\n**练习思维**：利用碎片化时间，花十分钟做十道题。没看出来的题拍照或印在脑中，白天空闲时想一想。\n\n**图推整体思维（核心口诀）**：\n\n\u003e **题干找共性，选项找差异，整体判方向，细节猜心思。**\n\n### 1.2 定性分析（屈臣氏整风）\n\n\"屈臣氏整风\"是定性分析的速记口诀，涵盖六大考点：\n\n|口诀|考点|细化内容|\n|---|---|---|\n|**屈**|曲直性|有无曲线；全曲/全直/曲直；曲线数量；曲线与直线关系（相切/相交/相离）|\n|**臣**|对称性|对称性质（轴对称/中心对称/两者兼具）；对称轴方向；对称轴数量；过点过线过面；多条对称轴位置关系；整体对称|\n|**氏**|相同相似|各图形间均存在同一元素；内部存在相同元素或内外元素相似；相邻图形有相同相似元素（元素前后传递）|\n|**整**|整体部分|整体图形与多部分图形；各图形的部分数|\n|**风**|封闭开放|是否存在封闭空间；全封闭/半封闭/全开放性质判断；封闭空间数量|\n|**奇偶**|奇偶性|某种元素数量的奇数/偶数分类|\n\n**对称性\"三大哥三小弟\"**：\n\n- **三大哥**：性质（轴对称还是中心对称）、数量（几条对称轴）、方向（横、竖、45度等）\n    \n- **三小弟**：过点过线过面、位置关系、整体对称\n    \n\n**常见对称图形速记**：\n\n- 中心对称：Z、S、N、风车、太极、平行四边形\n    \n- 既是轴对称又是中心对称：H、I、O\n    \n\n### 1.3 定量分析（点线面角素）\n\n|考点|细化内容|\n|---|---|\n|**点**|曲直交点；十字交点；切点；内部交点；外框交点；拐点处特征|\n|**线**|直线数；曲线数；横竖线数量；笔画数；内外数量和差；点发射射线数|\n|**面**|封闭空间数；相同面数量；面的面积|\n|**角**|直角数量；锐角/钝角数量|\n|**素**|元素种类；元素个数；元素换算；元素遍历|\n\n**笔画数核心知识**：\n\n- **奇点**：发射出奇数条射线的点（包括端点/露头、T点）\n    \n- **公式**：奇点数 / 2 = 笔画数\n    \n- **一笔画判定**：0个奇点或2个奇点\n    \n- **\"吹捏法\"**：形成封闭空间就可以去掉（捏掉独立单区域空间），剩下线条几笔画，原图即为几笔画\n    \n- **提示特征**：出头、T点、分离、特殊符号（日、田、☆、奥迪车标等）\n    \n\n**元素换算解题思路**：\n\n- 两种元素数量逐渐增多时，考虑等差递增\n    \n- 可代入计算：如 2A + 6B = 4A + 2B，则 A = 2B\n    \n\n### 1.4 位置分析（直接想位移）\n\n图形样式相同或相似但位置变化时考虑。\n\n|口诀|考点|细化内容|\n|---|---|---|\n|**直**|垂直平行|垂直平行关系；平行线组数|\n|**接**|连接方式|点连接/线连接；连接处特征；连接处线段数|\n|**想**|方向|对称轴方向；折线首尾线段方向（平行/垂直、同向/反向）；特征线方向|\n|**位**|位置关系|指示点位置；相对位置|\n|**移**|移动|上下/左右/圆周移动；内外圈双移动；旋转/翻转；去同存异/去异存同；黑白块运算|\n\n**移动题难点提示**：\n\n- 折返移动（撞墙即返）\n    \n- 内外圈同时移动\n    \n- 六边形斜线移动\n    \n- 移动步数可能递增\n    \n\n### 1.5 四大类题型\n\n#### 1.5.1 对称图类\n\n考察维度：性质 -\u003e 数量 -\u003e 方向 -\u003e 过点过线过面 -\u003e 位置关系 -\u003e 整体对称\n\n#### 1.5.2 背景图类\n\n**\"三大哥\"**：\n\n- **移动**：轮廓相同 + 元素数量一致 + 远小于轮廓格子数 -\u003e 优先移动\n    \n- **叠加**：轮廓相同 + 元素数量不一致（参差不齐） + \"3x3\"或\"3+3\"排列 -\u003e 优先叠加（去异存同/去同存异）\n    \n- **部分数**：黑点呈顶格状，有切断感 -\u003e 考虑部分数（黑白点抱团）\n    \n\n**\"六小弟\"**：\n\n- **笔**：黑/白点连成线条状 -\u003e 笔画数\n    \n- **面**：清晰图形轮廓 -\u003e 面积/周长\n    \n- **连**：阴影位置存在点连接或线连接\n    \n- **报**（抱团）：图形杂乱分散，小黑块几个几个聚在一起\n    \n- **对**（对称）：黑格或白格分布规则\n    \n- **滴**（递推）：每行（列）均有阴影 + 相邻图形相似 + 行列很多（5x5以上）\n    \n\n#### 1.5.3 分割图类（口诀：连打三遍对象）\n\n|考点|说明|\n|---|---|\n|连接方式|与外部轮廓公共边数量|\n|大小|最大面和最小面相似|\n|三不沾|中间图形与外部轮廓无公共点和公共边|\n|边数|最大面/最小面/外部轮廓为规整多边形|\n|对称|最大面/最小面为对称图形|\n|相似|内部存在相同相似图形或内外相似|\n\n#### 1.5.4 汉字类\n\n|考点|说明|\n|---|---|\n|文字结构|左右/上下/全包围/半包围结构|\n|笔画数/第一笔|笔画递增；每行第一笔相同|\n|偏旁部首|每组均有相同部分|\n|拼音|韵母规律；声母规律|\n|空间数量/部分数|封闭空间数递增；部分数递增|\n|曲直性|纯直/有曲线字母|\n\n### 1.6 六提示（快速识别考点方向）\n\n|提示|触发特征|常见考法|\n|---|---|---|\n|**平行组数**|两个相同/相似三角形；N/Z/工/H字型|平行线组数|\n|**圆提示**|各图均有圆或曲线|圆内交点数；圆内空间数；直线与圆的相交/相切/相离；包围/半包围|\n|**笔画数**|出头、T点、分离、日/田/☆|一笔画/多笔画|\n|**连接方式**|简笔画（树叶、蜡烛等）|点连接/线连接|\n|**直角数**|垂线、直角三角形、矩形|直角数递增/递减|\n|**数量加减**|规整外部轮廓（多边形）；两种元素；\"十\"字|外部线条数与内部点/线/面之和差|\n\n### 1.7 立体图形\n\n#### 六面体展开图\"三板斧\"\n\n1. **对立面排除**：应为对立面的两个面若相邻，直接排除\n    \n2. **平移法**：处理母图时，可将面1平移至面4右侧（反之亦可），面5、6随面1、4一起平移\n    \n3. **中心对称处理**：若面5、6为中心对称图形，可直接平移两格；否则需旋转180度\n    \n\n**对立面规律**：\n\n- 点连接面：可绕公共点旋转\n    \n- 线连接面：保持公共边不变\n    \n- 对立面：永远不存在连接关系\n    \n\n#### 截面图\n\n|立体|可截出图形|\n|---|---|\n|长方体|锐角三角形、梯形、平行四边形、非正五边形、六边形|\n|圆柱|正圆形、椭圆形、长方形（正方形取决于高与直径之比）|\n|圆锥|圆形、等腰三角形、椭圆形|\n\n**解题原则**：一般可截出简单规整图形，\"缺失\"部分一般也是规整图形。不规整的选项可直接排除。\n\n#### 立体视图\n\n- 视图由**轮廓 + 内部线条**组成\n    \n- 内部线条来自不平滑的\"棱\"产生的实线\n    \n- 六个方向：主/后/左/右/俯/仰视图\n    \n\n#### 立体拼合\n\n- 方法一：逐层画图法\n    \n- 方法二：将已知部分拼合后找缺失部分\n    \n\n---\n\n## 二、定义判断\n\n### 2.1 总体做题思想\n\n\u003e **定义判断更重理解，要站在一定高度上把握，可联系生活中的人或事或某种现象，试着猜测其现实所指。**\n\n**核心原则**：\n\n- 定义判断不是\"连连看\"，不能只找关键要素一一对应（\"只见树木不见森林\"）\n    \n- **被定义词**才是最关键信息——为什么选这个词作为定义名称，因为\"名\"里有最重要特征\n    \n- 读题过程 = 寻找被定义词中特征对应的过程\n    \n\n**需特别关注**：\n\n- **主体**（谁在做）\n    \n- **对象**（对谁做）\n    \n- **特殊要求**（限定条件）\n    \n- **中心语**（核心是什么）\n    \n\n**最大陷阱**：\n\n\u003e 属于/不属于一定分清！养成良好读题习惯。不属于题目的错误选项都是\"例子\"，可借用例子理解定义。\n\n### 2.2 单定义解题方法\n\n#### 偏正短语式\n\n被定义词为偏正短语时，重点拆解修饰语和中心语：\n\n- 例：**体验式采访** = 体验式（修饰）+ 采访（中心语）-\u003e 必须同时满足\"体验\"和\"采访\"\n    \n- 例：**无感审批** = 无感（修饰）+ 审批（中心语）-\u003e 必须同时满足\"自动/无感\"和\"审批\"\n    \n\n#### 关键词提取法\n\n|关注点|说明|举例|\n|---|---|---|\n|**主体**|谁在执行|企业、政府、档案馆、个人|\n|**对象**|作用于谁|档案、犯罪嫌疑、患者|\n|**时间限定**|何时发生|\"起诉前\"、\"事前\"|\n|**方式/手段**|如何做|\"智能技术\"、\"现代科学技术\"|\n|**目的/结果**|达到什么|\"获得商业回报\"、\"预防中风\"|\n|**中心语**|本质是什么|燃料、系统、行为、投资|\n\n### 2.3 多定义题处理\n\n- 注意找**一一对应**关系\n    \n- 正确选项有时会**完美对应**定义结构\n    \n- 先明确每个定义的核心区别点，再逐一匹配\n    \n\n### 2.4 常用技巧\n\n#### 造句法\n\n将选项代入定义语句，判断是否成立。适用于抽象定义或关系类定义。\n\n#### \"与众不同\"法\n\n当多个选项看似都符合时，找到那个特殊的选项：\n\n- 比较项中只有一个是\"必须\"的，其他都是\"可有可无\"的\n    \n- 选项中有\"新旧方法\"之分的\n    \n\n#### \"新旧\"判断法\n\n当定义涉及新概念时：\n\n- 看选项是传统方式还是创新方式\n    \n- 传统方式（几十年前就有的）不符合\"新\"概念\n    \n\n### 2.5 专业性定义\n\n|领域|注意事项|\n|---|---|\n|**法律**|忠于罪名定义；注意\"事前通谋\"vs\"事后帮助\"；多做一步可能是其他罪名|\n|**医学**|注意是长期过程还是短期现象；有根据vs无根据的惊慌|\n|**经济/科学**|注意因果关系；解释变量vs被解释变量；时间滞后效应|\n\n### 2.6 常见陷阱总结\n\n|陷阱类型|说明|\n|---|---|\n|主体不符|选项中的执行者不是定义要求的主体|\n|对象错误|作用对象与定义不一致|\n|缺少核心要素|只满足部分条件，缺少关键要素|\n|属于/不分清|题目问\"不属于\"却选了\"属于\"的|\n|比较项干扰|选项在做无关比较而非直接否定|\n|中心语偏离|选项本质不是定义所说的那类事物|\n\n---\n\n## 三、类比推理\n\n### 3.1 总体做题思想\n\n\u003e **以我为主，主动找题干与选项的内在联系；切忌被出题人\"牵着鼻子走\"。**\n\n- 类比推理是**假设性推理**，如果逼着自己给选项找理由，总能找到千奇百怪的理由\n    \n- 注意**\"大众思维\"**和**\"简单思维\"**，多想词与词本身的内在联系\n    \n- 常用方法：**造句子**（选择与题干相似点最多的选项）\n    \n- 也可设想更合适的答案是什么，以此排除错误选项\n    \n\n**关系层级**：\n\n- **一级辨析**（优先看）：语义关系、范畴关系、对应关系\n    \n- **二级辨析**（再看）：语法关系、褒贬色彩、物理/化学变化\n    \n\n### 3.2 语义关系\n\n|类型|说明|示例|\n|---|---|---|\n|**近义/反义**|词语含义相近或相反|先礼：后兵（反+反）|\n|**引申/象征/双关**|词的引申义、象征义或一语双关|布衣：百姓（象征）；白鸽：和平（象征）|\n|**意思解释**|一个词是对另一词的解释|转念：主意（转念=改变主意）|\n|**同字不同义**|相同字在不同词中含义不同|峰：山峰（本义）：碳达峰（象征义）|\n\n**成语常见考法**：语义 + 褒贬色彩 + 结构分析\n\n- 近义成语需注意褒贬色彩差异（如\"志同道合\"褒义 vs \"沆瀣一气\"贬义）\n    \n- 满和盈不是同义，是递进关系（满了之后继续加才会盈）\n    \n\n### 3.3 语法关系\n\n|类型|说明|示例|\n|---|---|---|\n|**词性考察**|名词/动词/形容词|手足（名+名，有本义和引申义）|\n|**结构考察**|动宾/主谓/偏正/并列等|精准：扶贫（偏正）；蛛丝马迹（四个偏正）|\n|**句子成分**|词语在句中的位置/成分|风险：社会：预防 -\u003e 预防社会风险|\n\n**结构分析要点**：\n\n- 政通人和 = 政通 + 人和（并列）；国泰民安 = 国泰 + 民安（并列）\n    \n- 愚公移山、郑人买履 = 主谓宾结构\n    \n- 列锦手法：景色名词依次排列（枯藤老树昏鸦）\n    \n\n### 3.4 范畴关系\n\n#### 全同关系\n\n两个概念外延完全重合。包括：古今、中外、自他、雅俗、同义词等。\n\n- 例：父亲 = 爸爸；蹴鞠 = 足球；引擎 = 发动机\n    \n\n#### 并列关系\n\n|子类型|说明|判断方法|\n|---|---|---|\n|**矛盾关系**|非此即彼（除了A就是B）|两者之和 = 全部|\n|**反对关系**|除A、B外还有其他|两者之和 \u003c 全部|\n\n**常见矛盾对**：\n\n- 生/死、合法/非法、存在/虚无、物质/意识\n    \n- 硬件/软件、城市/农村、有偿服务/无偿服务\n    \n- 黑色金属/有色金属（除了黑色金属都属于有色金属）\n    \n\n#### 包含关系\n\n|子类型|判断方法|示例|\n|---|---|---|\n|**种属关系**|\"A是B的一种\"|苏格拉底是人类（特指）|\n|**组成关系**|\"A是B的一部分\"|石家庄是河北的一部分|\n\n**易错点**：\n\n- 特指 vs 泛指：苏格拉底（特指）vs 松树（泛指）\n    \n- 鳄鱼不是鱼（爬行动物）；蜗牛不是昆虫（软体动物）；蝙蝠、鲸鱼、海豚是哺乳动物\n    \n- 电气不是气；银河不是河；榆钱不是钱\n    \n\n#### 交叉关系\n\n满足\"有的A是B，有的A不是B，有的B不是A\"。\n\n- 常见交叉维度：**材质 + 功能**（铜镜：化妆镜；木碗：汤碗）\n    \n- 报案人：嫌疑人（同一案件中可为同一人）\n    \n\n### 3.5 对应关系\n\n#### 逻辑性对应\n\n|类型|说明|示例|\n|---|---|---|\n|**充分必要**|前推后/后推前|调查：发言权（没调查就没发言权，后推前）|\n|**因果**|前因后果|春暖：花开；绳锯：木断|\n|**行为目的**|前者为达到后者的行为|刻舟：求剑；投资：收益|\n|**哲学关系**|相互作用|实践：认识（实践决定认识，认识指导实践）|\n|**逆否命题**|A-\u003eB 等价于 非B-\u003e非A|开车不喝酒：喝酒不开车|\n\n#### 日常性对应\n\n|类型|说明|注意事项|\n|---|---|---|\n|**原材料**|A是B的原料|区分物理变化vs化学变化|\n|**功能**|A具有B功能|注意功能的准确描述|\n|**职业**|职业：工作内容：成果|注意工作内容的准确性|\n|**前后顺序**|事件发生的先后|注意主体一致性和连续性|\n|**场所**|地点：活动：对象|注意区分休息场所和活动场所|\n|**命名方式**|以何命名|材质/图案/功能/属性命名|\n|**属性**|事物具有的属性|区分属性vs功能|\n\n#### 理论性对应\n\n- **自然科学**：物理/化学/生物常识（导体、金属分类等）\n    \n- **文学常识**：作品-人物-外号对应；敬词/谦词区分\n    \n- **历史知识**：典故出处（如\"讷言敏行\"出自《论语》）\n    \n\n---\n\n## 四、逻辑判断\n\n### 4.1 归因论证\n\n#### 整体框架\n\n归因论证 = **对比实验/既成事实 + 原因分析**\n\n|类型|说明|\n|---|---|\n|**对比实验归因**|通过实验分组对比得出结论（重点+难点）|\n|**时间对比归因**|当前与以往对比找变化原因|\n|**一般归因**|对既成事实进行原因分析|\n|**直接根本原因**|原观点vs反对者观点的博弈|\n\n#### 对比实验归因——三大质疑方式\n\n|质疑方式|核心思路|力度|\n|---|---|---|\n|**另有他因**|找到实验组与对照组的另一不同点|中等|\n|**因果倒置**|结果发生在原因之前，不能是此原因导致结果|较强|\n|**否定此因**|直接否定题干认定的原因|较强|\n\n**另有他因正确选项特征**：\n\n\u003e 回归实验，找到实验组和对照组的另一可能影响结果的不同点。\n\n**常见错误选项**：\n\n- 未谈论原因的选项\n    \n- 未分组的典型**伪他因**（\"暴饮暴食也会长胖\"没有回归实验）\n    \n- \"有些\"类选项\n    \n- 实验瑕疵类选项（样本不足等，质疑力度很弱）\n    \n\n**\"继发关联\"的另有他因**：\n\n- A与B不存在因果关联，A和B均是共同原因C导致的结果\n    \n- 例：地球转速放缓与强震增多，均是地核变化的结果\n    \n\n**利用分组找到另有他因**：\n\n- 根据最终结论确定实验组和对照组\n    \n- 在正确分组中找到另一可能影响结果的变量\n    \n\n#### 因果倒置\n\n- 本质：**原因在结果之后**，不能是此原因导致了结果\n    \n- 因果倒置力度 \u003e 另有他因\n    \n\n#### 否定此因\n\n- 不探讨原因是什么，只是否定题干认定的原因\n    \n- 例：\"失智是脑部疾病导致的认知退化，跟睡眠时长无关\"\n    \n\n#### 排除他因支持\n\n- 排除其他可能影响结果的因素，让题干原因成为唯一可能\n    \n- 例：\"新型测速探头安装前后，实际违章案件数基本相同\"（排除他因）\n    \n\n#### 时间对比归因\n\n- 找到当前与过去的另一点不同来进行他因削弱\n    \n- **核心原则**：一直存在且无变化的事实不会是某种变化的原因，\"变化\"才是\"变化\"的原因\n    \n\n#### 直接根本原因（可秒杀题型）\n\n- 题目结构：原观点 + 反对者观点\n    \n- 正确答案：原观点认为的原因是导致反对者认为的原因的根本原因\n    \n- 即：原观点 -\u003e 反对者原因 -\u003e 结果\n    \n\n### 4.2 一般质疑\n\n#### 无论据有结论\n\n- 题干结构：背景 + 分析 + 结论\n    \n- 质疑方式：提出反向论据\n    \n- 注意：话题一致，主体正确，贴合题干\n    \n\n#### 有论据有结论\n\n|质疑方式|说明|适用场景|\n|---|---|---|\n|**质疑论据**|指出论据本身有问题|论据是个人观点/判断时|\n|**增加反向论据**|找到题干未考虑的负面因素|题干只列优点/以偏概全时|\n|**断点拆桥**|论据和结论不相关，\"推不出\"|论据与结论存在逻辑断层时|\n|**质疑\"无中生有\"**|结论中出现过度推断的内容|结论过于绝对/夸大时|\n\n**\"虽然但是所以不\"造句法**：\n\n\u003e 虽然（论据内容），但是（选项内容），所以结论是错误的\n\n**断点拆桥核心**：找到论据和结论之间的逻辑跳跃点\n\n- 例：论据是\"第一场雪早\"，结论是\"冬天最冷\"，断点是\"下雪时间与气温无明显相关\"\n    \n\n### 4.3 严谨逻辑关系质疑\n\n若结论存在逻辑关联词（如果就/只有才/所有都），可翻译为 A-\u003eB，在选项中寻找 **A且非B**。\n\n**命题真假判断**：\n\n|前件A|后件B|A-\u003eB|\n|---|---|---|\n|真|真|真|\n|真|假|**假**|\n|假|真|真|\n|假|假|真|\n\n\u003e **A-\u003eB为假，只有一种情况：A真且B假**\n\n### 4.4 支持、前提假设与解释\n\n#### 五种常见支持方式\n\n1. **解释说明**：对结论进行原理解释\n    \n2. **断点搭桥**：弥补论据和结论之间的逻辑断裂\n    \n3. **增加正向论据**：补充有利的证据\n    \n4. **必要条件（反向代入）**：若该条件不成立，结论也不成立\n    \n5. **举例支持**：用具体例子证明结论\n    \n\n#### 三种常见前提假设\n\n1. **断点搭桥**：连接论据和结论\n    \n2. **补充漏洞**：填补论证中的逻辑空缺\n    \n3. **必要条件/能与不能**：没有这个条件，结论无法成立\n    \n\n#### 变化/比较的支持\n\n- **构成对比实验**：选项与题干形成\"异因异果\"的支持（四圈支持）\n    \n- **补充对比实验**：\"异因同果\"/\"同因异果\"进行质疑（三圈质疑）\n    \n\n### 4.5 推出推理\n\n#### 等价推出\n\n- **与题干等价**：找到与题干逻辑等价的选项\n    \n- **与题干不等价**：找出不等价的选项\n    \n\n#### 正推与逆推\n\n- **正推**：根据已知事实推导结论\n    \n- **逆推**：根据所需结果反推条件\n    \n\n#### 两难推理\n\n- A-\u003eB 且 非A-\u003eB，则B一定成立\n    \n\n### 4.6 分析推理\n\n#### 翻译规则速查表\n\n|提示词|翻译|\n|---|---|\n|如果a那么b、若a则b、只要a就b|a -\u003e b|\n|只有a才b、必须a才b、不a不b|b -\u003e a|\n|除非a否则b、a否则b|非a -\u003e b|\n|b是a的基础/关键/前提|a -\u003e b|\n|a且b|a 且 b|\n|a或b|a 或 b|\n|非(a且b)|非a 或 非b|\n|非(a或b)|非a 且 非b|\n\n#### 真假话分析——矛盾法\n\n**三类矛盾关系**：\n\n1. A 和 非A；A且B 和 非A或非B；A或B 和 非A且非B\n    \n2. 所有 和 有些不；有些 和 所有不；可能 和 必然不\n    \n3. A-\u003eB 和 A且非B\n    \n\n**解题步骤**：\n\n1. 找到矛盾的两个命题\n    \n2. 确定矛盾中必有一真一假\n    \n3. 根据题干真/假数量，判断其余命题的真假\n    \n4. 从确定为真/假的命题推导答案\n    \n\n#### 假设法\n\n- 假设某条件为真，若推出矛盾则原假设为假\n    \n- 适用于：无法直接找到矛盾的情况\n    \n\n#### 代入法\n\n- 从选项入手代入验证\n    \n- 适用于：选项信息充分或题干条件复杂时\n    \n\n### 4.7 范畴推理\n\n#### 直言命题核心知识\n\n|知识点|内容|\n|---|---|\n|**否定规则**|所有的否定 = 有些不；有些的否定 = 所有不|\n|**推出关系**|所有 -\u003e 有些 -\u003e 特例（单向推出）|\n|**有些特殊**|有些是推不出有些不是；有些A是B -\u003e 有些B是A|\n\n#### 集合关系——一分为二画图法\n\n- 找到\"所有A都（不）是B\"，分为B和非B两部分\n    \n- 所有表述画实线，有些表述画虚线\n    \n- 在两侧分别标注各集合\n    \n\n**关键推导**：\n\n- 两个\"所有都\"可以形成链条：所有A是B + 所有B是C -\u003e 所有A是C\n    \n- 两侧分离的集合一定没有交集（一定为假）\n    \n- 虚线部分的位置不确定（可能为真也可能为假）\n    \n\n---\n\n## 五、核心易错点速查\n\n### 图形推理易错点\n\n1. 笔画数的奇点包括**端点（露头）**和**T点**\n    \n2. \"过线\"要求对称轴和原图形的某条线**重合**，垂直不算\n    \n3. 背景图类\"部分数\"：黑点顶格时注意黑白点分别计算部分数\n    \n4. 截面图中圆锥只能截出**等腰三角形**，不能截出一般三角形\n    \n5. 六面体展开图中对立面永远不相邻\n    \n\n### 定义判断易错点\n\n1. 一定要看清是\"属于\"还是\"不属于\"\n    \n2. 被定义词本身包含最重要的特征，不要忽略\n    \n3. 比较项选项往往不是正确答案\n    \n4. \"有些\"/\"部分\"类选项通常质疑力度不足\n    \n5. 专业性定义要忠于专业术语的准确含义\n    \n\n### 类比推理易错点\n\n1. 种属关系注意特指vs泛指\n    \n2. 矛盾关系 vs 反对关系：矛盾是\"非此即彼\"，反对是\"还有其他\"\n    \n3. 原材料题注意区分物理变化vs化学变化\n    \n4. 造句法要选择与题干**相似点最多**的选项\n    \n5. 范畴关系是一级辨析，语法关系多为二级辨析\n    \n\n### 逻辑判断易错点\n\n1. 另有他因必须**回归实验**，伪他因（未回归实验的泛泛而谈）不是正确选项\n    \n2. 因果倒置力度 \u003e 另有他因\n    \n3. 实验瑕疵类选项（样本不足等）质疑力度很弱\n    \n4. A-\u003eB为假**只有**一种情况：A真且B假\n    \n5. \"有些是\"推不出\"有些不是\"；\"有些不\"推不出\"所有都不\"\n    \n6. 一直存在且无变化的事实不是变化的原因"])</script><script>self.__next_f.push([1,"6:T91d3,"])</script><script>self.__next_f.push([1,"# 花生13（四海公考）言语理解模块 - 完整学习笔记\n\n\u003e 本笔记整理自花生13言语理解模块全部课程资料，按知识点/方法论组织，不按讲次排列。适用于考前系统复习。\n\n---\n\n## 第一部分：片段阅读\n\n### 一、题型分类与识别\n\n片段阅读共有**六种题型**，做题第一步是**先读问题**，判断题型和文段可能类型。\n\n|题型|常见问法|\n|---|---|\n|**中心理解题**|\"这段文字意在说明/强调\"、\"这段文字主要介绍了\"、\"下列对文意概括最恰当的是\"|\n|**标题拟定题**|\"最适合做这段文字标题的是\"|\n|**下文推断题**|\"这段文字接下来最可能讲的是\"|\n|**语句填入题**|\"填入画横线部分最恰当的一项是\"|\n|**语句排序题**|\"将以上6个句子重新排列，语序正确的是\"|\n|**细节判断题**|\"下列选项中，与这段文字意思不相符的是\"、\"对这段文字理解错误的是\"|\n\n---\n\n### 二、整体解题原则与思路\n\n#### 2.1 做题三原则\n\n1. **抓关键信息**或确定文段类型，选项干扰力度不强，则直接确定答案\n    \n2. **套入常见结构**，找到文段主旨或重点，锁定正确选项\n    \n3. **二选一纠结时**，利用选项分析，排除错误选项，让正确选项\"跳出来\"\n    \n\n#### 2.2 做题顺序\n\n\u003e **先读问题**（分辨题型和文段可能类型）→ **再读文段**（分析结构和预想答案）→ **分析选项**（利用选项提升速度与准确度）\n\n#### 2.3 阅读文段方法\n\n- 在**句号处划斜线**，再分层\n    \n- **宏观上把握结构**，不能\"只见树木不见森林\"\n    \n- 解题方法：结构分析（套入五种文段结构）、选项分析、抓准关键信息\n    \n\n---\n\n### 三、三类文段的处理方法\n\n根据文段描写内容，可将题干文段分为**说理类、科普介绍类、新闻类**三种。\n\n|文段类型|特征|常见问法|解题原则|\n|---|---|---|---|\n|**说理类**|阐述作者观点、态度、对策|主旨是什么、意在说明什么、意图强调什么、观点是什么|有对策优先选对策；有观点态度选观点态度；有问题要体现问题（可概括问题也可解决问题）|\n|**科普介绍类**|客观介绍现象、事件、知识|主要介绍了什么、主要讲了什么、最适合的概括是|选\"中性、客观\"的概括选项，**反而不选对策**|\n|**新闻类**|介绍新发生的事件或研究新突破|主要讲了什么、意在强调什么、重在强调什么|重视新状况、新成绩、新突破等\"**新**\"|\n\n\u003e **重要区分**：说理类文段选对策，科普类文段选中性客观概括。如果选项中出现\"分析...原因\"这类因果结构的表述，原文一般为果因或因果结构，可通过选项反推原文验证。\n\n---\n\n### 四、五种常见对策表达方式\n\n识别对策句是中心理解题的核心能力。对策不一定以\"应该\"出现，以下五种方式均可表达对策：\n\n#### 4.1 祈使或建议给对策\n\n关键词：**应该（应）、需要（要）、必须、要求、可以、不妨**等。\n\n#### 4.2 禁止型对策\n\n关键词：**不能、禁止、要避免、如果……就不……** 等。\n\n#### 4.3 逻辑关联词表对策\n\n- **只有……才**：只有后为对策重点\n    \n- **如果……就**：均可能\n    \n- **必须……否则**：必须后为对策重点\n    \n\n#### 4.4 必要条件表对策\n\n关键词：**基础、关键、前提、离不开、必不可少、不可或缺**等。\n\n#### 4.5 语义表对策\n\n关键词：**时代命题、重要议题、负有……义务、长远目标、必经之路、必然趋势、有助于**等。\n\n\u003e **注意**：\"有助于\"可翻译为对策表述。例如\"赏析古诗词有助于培养环保意识\"可翻译为\"培养环保意识可以去赏析古诗词\"。\n\n---\n\n### 五、五种文段结构\n\n#### 5.1 后对策结构\n\n**行文脉络**：引出话题（问题）→ 分析论证 → 给出对策或观点\n\n- 说理类文段**最常用**结构\n    \n- 正确选项应是**总结或针对问题的对策**\n    \n- 完美选项为**包含问题和解决措施**\n    \n\n\u003e **做题要领**：后对策结构选对策，关注**对策的核心内容**，不能过于宽泛。\n\n#### 5.2 前对策结构\n\n**行文脉络**：\n\n- 引出话题（问题）→ 直接给出对策或观点 → 论证（重复观点对策）\n    \n- 引出话题（问题）→ 直接给出对策或观点 → 详细介绍具体对策\n    \n- 经常有**转折或对比**引出对策\n    \n- 正确选项应是针对问题的对策\n    \n- 完美选项为包含问题和解决措施\n    \n\n\u003e **做题要领**：前对策结构，对策后面常有\"分析意义\"或\"具体展开\"的论证部分，不要被论证部分带偏。\n\n#### 5.3 总分与分总结构\n\n- **总分**：先提出观点，再分析论证\n    \n- **分总**：先分析介绍，最后总结观点\n    \n\n\u003e **做题要领**：总句是重点。可通过选项反推验证，如出现\"分析...原因\"的选项，原文一般为果因或因果结构。\n\n#### 5.4 并列与大并列结构\n\n- 文段各部分为并列关系，无明确重点\n    \n- 正确选项应**全面概括**，不能只对应某一部分\n    \n- 主题词法在此类结构中特别有效\n    \n\n#### 5.5 二层结构（重点难点）\n\n##### (1) 转折+对比\n\n- 转折后可能是重点，也可能**转折前后均重要**\n    \n- 对比文段常见**时间对比、国别对比**\n    \n- 一般**当今、我国**是重点\n    \n- 时间对比可能突出表示现在的改变\n    \n\n##### (2) 因果+果因\n\n- 因果结构：先给原因，后给结果\n    \n- 果因结构：先给结果，后分析原因\n    \n- 可通过\"原因类\"选项逆推\n    \n\n##### (3) 背景+正文\n\n- 背景知识是为了**引出下文服务**\n    \n- 背景专业性较强，可**略读**\n    \n- **重点关注正文**，尤其是\"我国\"、\"新突破\"、\"新成绩\"、\"新发现\"等\n    \n- \"背景+新\"结构，答案要体现\"新\"\n    \n\n##### (4) 设问+回答\n\n- 由问题引出，下文为对此问题的回答\n    \n- **重点关注该问题的答案**\n    \n- 补充说明部分不是重点\n    \n\n---\n\n### 六、如何抓准问题与对策\n\n这是解题的核心能力，需要准确把握文段中的\"问题\"和\"对策\"：\n\n1. **区分问题和对策**：问题是什么，对策针对问题给出\n    \n2. **避免\"对策的对策\"**：有些选项是对对策的进一步建议，不是文段本身的对策\n    \n3. **避免对策表述不准确**：对策太宽泛或与原文表述不符\n    \n4. **注意必要条件位置**：对策在必要条件位置时（如\"离不开\"\"关键\"），该条件是对策重点\n    \n5. **选项对策不能将对策与目的搞反**\n    \n\n---\n\n### 七、抓准关键信息\n\n#### 7.1 高频词\n\n文段中**反复出现的词语**，重要程度较高。可通过主题词锁定答案。\n\n#### 7.2 主体/主题\n\n- 确定文段的**主题词**（核心讨论对象）\n    \n- 正确选项通常**包含主题词**\n    \n- 选项缺少主题词可直接排除\n    \n\n#### 7.3 首句\n\n首句经常是**引出话题**或**总论**，对理解全文结构至关重要。\n\n#### 7.4 引出话题的五种方式\n\n1. 直接提出话题\n    \n2. 背景知识引出\n    \n3. 转折引出\n    \n4. 设问引出\n    \n5. 时间/国别对比引出\n    \n\n---\n\n### 八、选项分析方法\n\n#### 8.1 两出处+六有误（排除错误选项）\n\n**两出处**：\n\n- 选项内容在原文中找不到出处（无中生有）\n    \n- 选项内容出处有误（张冠李戴）\n    \n\n**六有误**：\n\n1. 主体/话题不一致\n    \n2. 时态有误（过去/现在/将来搞混）\n    \n3. 程度过重或过轻\n    \n4. 范围过大或过小（片面）\n    \n5. 杂糅（将不同部分拼凑）\n    \n6. 推不出来（过度推断）\n    \n\n#### 8.2 四大类+一比较+一正确\n\n**四大类常见错误选项**：\n\n1. 非对策表述（属于科普/介绍/背景内容）\n    \n2. 只对应文中一部分（片面）\n    \n3. 范围过大/话题不一致\n    \n4. 无中生有\n    \n\n**一比较**：二选一时，对比两个选项的差异点，看哪个更贴合文段 **一验证**：用选项反推原文，验证是否匹配\n\n---\n\n### 九、各题型专项技巧\n\n#### 9.1 中心理解题\n\n- 核心方法：**结构分析 + 关键信息 + 选项分析**\n    \n- 说理类选对策，科普类选中性概括\n    \n- 时间对比类文段，答案最好体现时间上的对比\n    \n- 并列结构要全面概括\n    \n\n#### 9.2 标题拟定题\n\n- 标题要**全面概括**文段内容\n    \n- 必须包含**主题词**\n    \n- 不能过于绝对\n    \n- 新闻类标题要体现\"新\"\n    \n- 科普类标题不能给对策\n    \n\n#### 9.3 下文推断题\n\n**三类常见结构**：\n\n1. 文段是\"总-分1\"结构，下文应讲\"分2\"\n    \n2. 文段末尾提出问题，下文应给出对策\n    \n3. 文段末尾给出新概念/新话题，下文应详细介绍\n    \n\n**不易识别的三种二层结构**：\n\n- 注意末尾句的小转折可能只是论证过程中的小转折，不是下文方向\n    \n- 下文不太可能介绍已经讨论过的内容\n    \n\n#### 9.4 语句填入题\n\n**根据横线位置分类处理**：\n\n|位置|处理方法|\n|---|---|\n|**开篇**|引出话题，统领全文，注意与后文的衔接|\n|**中间**|考虑对策句或承上启下句，关注横线处的**上下文**|\n|**结尾**|多为总结或对策句，注意**首尾呼应**|\n\n**盯住细节**：\n\n- 语法结构正确（主谓宾搭配得当）\n    \n- 逻辑关联词运用得当\n    \n- 全文主语一致\n    \n- 后文指示代词指代正确\n    \n- 特别考虑**句式一致**\n    \n\n#### 9.5 语句排序题\n\n**宏观把握**：\n\n1. 通过**套入结构**（前对策、后对策、总分、并列等），确定行文顺序\n    \n2. 通过**明显前后顺序**（时间、指代等），确定行文顺序\n    \n3. 通过**\"分堆\"**的方法（同一话题相邻），大致确定行文顺序\n    \n\n**盯住细节**：\n\n- **判断首句**：\"下定义\"是首句的可能性很高，有指代的一定不会是首句\n    \n- **捆绑组合**：通过转折、指代、相同词语找到必须捆绑在一起的\"组合句\"\n    \n- 指示代词（\"这\"\"此\"\"其\"等）必须有明确的指代对象\n    \n- 相同话题的句子应相邻\n    \n\n#### 9.6 细节判断题\n\n- 可利用**常识\"猜\"答案**再验证\n    \n- 注意区分\"**一定对/错**\"和\"**可能对/错**\"的判断\n    \n- 仔细对照原文，不能主观推断\n    \n\n---\n\n## 第二部分：逻辑填空\n\n### 一、解题基本原则\n\n逻辑填空虽然存在方法与技巧，但更重要的是**深刻掌握高频成语与常考实词**。方法技巧是辅助，词汇积累是根本。\n\n**核心思路**：\n\n1. 先读全段，把握整体语境和感情色彩\n    \n2. 找到逻辑对应关系（解释、递进、转折、并列等）\n    \n3. 辨析选项词语的**词义、词性、感情色彩、程度、搭配**\n    \n4. 优先从最有把握的空入手\n    \n\n---\n\n### 二、词义辨析\n\n#### 2.1 常考实词辨析\n\n**彰显 vs 凸显 vs 展示/展现/显示**：\n\n- 彰显：一般用在**积极语境**，彰显精神/文化/品质/情怀\n    \n- 凸显：用在凸显**问题或事情的严重性/重要程度**，褒贬都可以\n    \n- **遇到显现、呈现、展示、表现等词时，彰显和凸显成为正确答案的概率较高**\n    \n\n**交融 vs 融合**：\n\n- 交融：界限不明确，你中有我、我中有你\n    \n- 融合：结果，二合一或多合一，互联网+/文化+常用融合\n    \n\n**勾勒 vs 擘画**：\n\n- 勾勒：简单几笔把框架画出来，或简单精炼几句话描述概括\n    \n- 擘画：计划筹谋，对未来美好展望（擘画蓝图/未来）\n    \n\n**反映 vs 代表**：\n\n- 反映：由事物表象反映内部深层次问题\n    \n- 代表：个例代表整体\n    \n\n#### 2.2 常考热词搭配\n\n|热词搭配|说明|\n|---|---|\n|历史耐心、战略定力|常见于政策文件语境|\n|党的坚强领导|固定搭配|\n|与时代同频共振|固定搭配|\n|踔厉奋发、砥砺前行|热词组合|\n|奋楫争先、勇毅前行、笃行不怠、赓续前行|相似热词|\n|波澜壮阔的发展史|固定搭配|\n|旷日持久的战争|固定搭配（贬义）|\n\n#### 2.3 高频成语辨析要点\n\n**合作配合类**：\n\n|成语|核心含义|数学比喻|\n|---|---|---|\n|**相得益彰**|两者搭配可起更大作用|1+1 \u003e 2|\n|**相辅相成**|两者天然耦合，互为补充、缺一不可|0.5+0.5 = 1|\n|**锦上添花**|已经很完美了，再增添一点|1+0.1|\n|**珠联璧合**|两个完美事物结合，强强联手|10+10|\n|**交相辉映**|两个优秀事物相互映照|—|\n|**相映成趣**|两者放在一起形成有趣的画面|—|\n|**双峰并峙**|两者各自是领域最高峰|—|\n\n**方向错误类**：\n\n|成语|核心含义|使用场景|\n|---|---|---|\n|**背道而驰**|方向和目的完全相反或背离正确目标|一般是**两个主体**|\n|**南辕北辙**|人的行动和目的相反|一般是**一个主体**|\n|**缘木求鱼**|方向或办法不对不可能达到目的|—|\n|**渐行渐远**|常比喻人与人之间关系慢慢疏远|—|\n|**分道扬镳**|各自向不同目标前进|—|\n\n**因地制宜类**：\n\n|成语|侧重|\n|---|---|\n|**因地制宜**|不同地域选择不同方法|\n|**对症下药**|针对不同情况确定措施和办法|\n|**有的放矢**|做事有目的性、针对性|\n|**量体裁衣**|强调个性化、一对一制定方案|\n|**随机应变**|随着情况变化灵活机动应付|\n\n**传承类**：\n\n|成语|核心含义|\n|---|---|\n|**一脉相承**|同一血统或派系世代传承（思想学说、行为模式的继承关系）|\n|**血脉相通**|比喻极亲近的关系（横向，兄弟姐妹之间）|\n|**薪火相传**|学问和技艺代代相传（师生授受不绝）|\n|**不绝如缕**|像细线似断非断，比喻情势危急或传承不断|\n|**陈陈相因**|沿袭老一套，没有改进（贬义）|\n\n**效果类**：\n\n|成语|核心含义|使用场景|\n|---|---|---|\n|**立竿见影**|立刻见到功效|常用于政策见效快|\n|**一蹴而就**|事情轻而易举、一下子就能成功|—|\n|**行之有效**|方法经过实践检验有效可行|—|\n|**一劳永逸**|一次劳动，永久安逸|—|\n|**事半功倍**|花小力气得大效果|—|\n|**釜底抽薪**|从根本上解决问题|—|\n|**标本兼治**|同时解决表面和根本问题|—|\n\n---\n\n### 三、逻辑对应\n\n#### 3.1 前后解释对应\n\n横线前后的内容往往对横线处词语有**解释、限定**作用。通过理解前后文的语义提示，可以精准锁定答案。\n\n**典型模式**：\n\n- 前文给出语境/背景，后文给出具体解释\n    \n- 横线处与前文或后文形成**语义呼应**\n    \n\n#### 3.2 逻辑性对应\n\n- **递进关系**：后文比前文语义更重，选词要符合递进逻辑\n    \n- **转折关系**：转折前后语义相反\n    \n- **并列关系**：并列结构中，各空应保持一致的逻辑关系\n    \n- **因果关系**：前因后果或前果后因\n    \n\n\u003e **重要技巧**：当题目出现语义递进时（如\"不仅...而且...\"），优先从递进关系入手解题。第三空如果有递进关系，优先从此入手。\n\n#### 3.3 比喻性对应\n\n文段中出现**比喻词**（如\"名片\"\"底片\"\"芯片\"\"通行证\"\"紧箍咒\"等），横线处词语应与比喻词的特性相匹配。\n\n- \"通行证\"具备抵达的特性\n    \n- \"底片\"对应不明显、不直接的特点\n    \n- \"紧箍咒\"对应严格约束\n    \n\n---\n\n### 四、特殊技巧\n\n#### 4.1 宏观把握、联系实际\n\n- 联想实际语境有助于判断感情色彩\n    \n- 联系实际场景有助于理解词语的适用情境\n    \n- 注意区分线上/线下、内部/外部等对比关系\n    \n\n#### 4.2 语法正确、搭配得当\n\n- 注意**主谓宾搭配**：主语是什么，谓语能否搭配\n    \n- 注意**修饰关系**：形容词能否修饰后面的名词\n    \n- 注意**固定搭配**：某些词只能和特定词搭配使用\n    \n\n#### 4.3 褒贬色彩、程度轻重、固定搭配\n\n- 判断语境需要的**感情色彩**（褒义/贬义/中性）\n    \n- 判断语境需要的**程度轻重**\n    \n- 注意**固定搭配**和**常见热词组合**\n    \n\n**易混感情色彩辨析**：\n\n|词语|感情色彩|适用场景|\n|---|---|---|\n|趋之若鹜|贬义|追求不好的东西|\n|敬而远之|中性偏褒|年轻人对传统文化（尊敬但不理解）|\n|日渐式微|中性|形容古典戏曲、纸媒、传统工艺走向衰落|\n|华而不实|贬义|华丽不实用|\n|空穴来风|贬义|毫无根据的传闻或消息|\n\n---\n\n## 第三部分：高频成语与实词分类整理\n\n### 一、中华文明与传统文化\n\n|成语|核心含义|使用要点|\n|---|---|---|\n|**源远流长**|源头远水流长，比喻历史悠久|侧重时间久|\n|**连绵不绝**|连续而不中断|侧重连续性|\n|**博大精深**|广博丰富，精湛深刻|侧重内容丰富|\n|**历久弥新**|经历长久时间而更加鲜活、有活力|侧重\"新\"|\n|**兼收并蓄**|对不同的人或事物都能同时收容保留|侧重包容性|\n\n\u003e **辨析**：源远流长侧重时间久；连绵不绝侧重连续性不断；博大精深侧重内容丰富深广；历久弥新侧重经过时间考验仍有新活力。\n\n---\n\n### 二、文化传承\n\n**传承不间断**：一脉相承、血脉相通、薪火相传、不绝如缕、陈陈相因\n\n**传承方式**：口耳相传、难以为继、后继无人、继往开来、承上启下\n\n\u003e **辨析**：后继无人指没有接班人（强调无人继承）；难以为继指难以继续下去（强调继续困难）。某行业无人继续从事是**后继无人**，生活过不下去是**无以为继**。\n\n---\n\n### 三、改革创新\n\n**改良旧的换新的**：推陈出新、吐故纳新、革故鼎新、弃旧图新、去芜存菁、除旧布新、激浊扬清\n\n|成语|使用场景|\n|---|---|\n|**推陈出新**|多形容文化，去掉旧糟粕创造新的|\n|**吐故纳新**|多形容事物发展中呈现新面貌（也指人才更替）|\n|**革故鼎新**|多政治角度，重大变革|\n|**弃旧图新**|由坏的转向好的，离开错误走向正确|\n|**去芜存菁**|除去杂质保留精华|\n|**除旧布新**|清除旧的建立新的|\n|**激浊扬清**|清除负面弘扬正面，\"激\"与\"扬\"联动|\n\n---\n\n### 四、创新与独特\n\n**形容创新**：另辟蹊径、标新立异、与时俱进、剑走偏锋、不拘一格\n\n**心思独特**：匠心独运、别出心裁\n\n**与众不同**：独树一帜、自成一家、别开生面、不落窠臼\n\n\u003e **辨析**：\n\u003e \n\u003e - 标新立异：有主观故意性，注意感情色彩（可褒可贬）\n\u003e     \n\u003e - 匠心独运：侧重**文艺创作**的心思巧妙\n\u003e     \n\u003e - 别出心裁：侧重**想法构思**巧妙\n\u003e     \n\u003e - 独树一帜：侧重**风格**独特\n\u003e     \n\u003e - 不落窠臼：多用于**文章或艺术作品**，不落俗套\n\u003e     \n\u003e - 别开生面：开创新的局面或形式\n\u003e     \n\n---\n\n### 五、守旧不创新\n\n墨守成规、抱残守缺、因循守旧、固步自封、食古不化\n\n|成语|侧重|\n|---|---|\n|**墨守成规**|因循守旧，不肯改变|\n|**抱残守缺**|固守陈旧残缺的东西不放，保守不知改进|\n|**因循守旧**|一直沿用旧办法（侧重**新与旧**）|\n|**固步自封**|安于现状，不求创新进取（侧重**开放与封闭**）|\n|**食古不化**|对古代知识理解不透，不善于按现在情况运用|\n\n---\n\n### 六、按规矩办事\n\n**按规矩**：按部就班、循规蹈矩、循规拘礼、照本宣科\n\n**有步骤**：循序渐进、有条不紊\n\n\u003e **辨析**：按部就班（中性词，按一定次序进行）；循规蹈矩（中性词，拘守旧准则不敢变动）；循规拘礼（遵循规则，拘泥礼节）；照本宣科（机械执行，缺乏创造性）。\n\n---\n\n### 七、处境困难\n\n**不敢前进**：望而却步、望而生畏、畏葸不前\n\n**不好抉择**：骑虎难下、进退维谷、进退失据、瞻前顾后、踟蹰不前、裹足不前\n\n**处境艰难**：举步维艰、寸步难行\n\n\u003e **辨析**：\n\u003e \n\u003e - 望而却步：侧重**行为上退却**（因害怕/惊讶/顾虑等）\n\u003e     \n\u003e - 望而生畏：侧重**情绪上害怕**\n\u003e     \n\u003e - 骑虎难下：同一件事已经开始就**难以停止**\n\u003e     \n\u003e - 进退维谷/进退失据：很难抉择，进退两难\n\u003e     \n\u003e - 瞻前顾后：顾虑太多，犹豫不决\n\u003e     \n\u003e - 裹足不前：因心存顾虑而停止行动，**停滞程度更彻底**\n\u003e     \n\u003e - 举步维艰：已陷入十分艰难的处境（能走但很难）\n\u003e     \n\u003e - 寸步难行：程度更重，一步都难以行走\n\u003e     \n\n---\n\n### 八、形势危险\n\n|成语|核心含义|\n|---|---|\n|**岌岌可危**|非常危险，快要倾覆或灭亡|\n|**危如累卵**|如同堆起来的蛋，随时可能塌下打碎|\n|**命悬一线**|处境危险，随时可能丧失生命|\n|**风雨飘摇**|局势动荡不安，很不稳定|\n|**危在旦夕**|危险就在眼前（侧重时间短）|\n\n\u003e **辨析**：岌岌可危侧重整体即将崩塌；危在旦夕侧重时间紧迫；风雨飘摇侧重局势动荡不稳。奄奄一息只用于人或事物气息微弱即将消亡。\n\n---\n\n### 九、事物出现、发展、衰落\n\n**出现/萌生**：层出不穷、风起云涌、方兴未艾、雨后春笋、横空出世、异军突起、应运而生\n\n**发展势头好**：高歌猛进、如火如荼、如日中天、势如破竹、突飞猛进\n\n**发展迅速**：一日千里、日新月异\n\n**逐渐衰落**：日渐式微、每况愈下、江河日下\n\n**其他**：水涨船高、此消彼长、波澜壮阔、柳暗花明、拨云见日\n\n\u003e **辨析**：\n\u003e \n\u003e - 层出不穷：接连出现（主语是事物）\n\u003e     \n\u003e - 方兴未艾：事物正在发展，尚未达到止境\n\u003e     \n\u003e - 雨后春笋：新生事物**大量涌现**（侧重数量多）\n\u003e     \n\u003e - 横空出世：突出、明显（侧重卓尔不群）\n\u003e     \n\u003e - 异军突起：一支**新生力量**突然崛起\n\u003e     \n\u003e - 应运而生：顺应时机而产生\n\u003e     \n\u003e - 日渐式微：常用于形容古典戏曲、纸媒、传统工艺走向衰落\n\u003e     \n\u003e - 每况愈下：情况越来越坏（也可形容身体/精神）\n\u003e     \n\u003e - 江河日下：一天不如一天（多指国势等发展趋势）\n\u003e     \n\u003e - 水涨船高：事物随着所凭借的基础而增长\n\u003e     \n\u003e - 波澜壮阔：声势雄壮或规模宏大（固定搭配：波澜壮阔的发展史）\n\u003e     \n\n---\n\n### 十、竞争比较\n\n**和别人比较**：相形见绌、出类拔萃、无与伦比\n\n**表现突出**：脱颖而出、崭露头角、大显身手\n\n**赶得上/赶不上**：望其项背、望尘莫及\n\n**同等地位**：相提并论、同日而语、等量齐观、一概而论\n\n\u003e **辨析**：\n\u003e \n\u003e - 相形见绌：跟同类比较显出不足\n\u003e     \n\u003e - 出类拔萃：品德才能出众，高出同类（侧重能力或品德）\n\u003e     \n\u003e - 无与伦比：非常完美，没有能相比的\n\u003e     \n\u003e - 脱颖而出：在竞争中胜出（有比较含义）\n\u003e     \n\u003e - 崭露头角：才华能力开始展现出来（没有比较含义）\n\u003e     \n\u003e - 望其项背：有能力赶得上（**常用于否定句**：难以/无法/不能望其项背）\n\u003e     \n\u003e - 望尘莫及：远远落在后面，相差甚远\n\u003e     \n\u003e - 相提并论：放在一起谈论或看待（多用于否定句）\n\u003e     \n\u003e - 同日而语：相提并论（侧重**时间上对比**，多形容与自身的比较）\n\u003e     \n\u003e - 等量齐观：把不同事物一律同等看待\n\u003e     \n\u003e - 一概而论：用同一标准对待处理（多用于否定：不能一概而论）\n\u003e     \n\n---\n\n### 十一、能力不足\n\n**能力有限**：力有未逮、爱莫能助、鞭长莫及、望洋兴叹、回天乏术\n\n**应付不了**：捉襟见肘、顾此失彼、左支右绌、独木难支、应接不暇\n\n\u003e **辨析**：\n\u003e \n\u003e - 力有未逮：有意愿却做不到\n\u003e     \n\u003e - 爱莫能助：心中关切同情却没有力量帮助\n\u003e     \n\u003e - 鞭长莫及：相隔太远力量达不到（有时指虽有能力但有限）\n\u003e     \n\u003e - 望洋兴叹：因力不胜任或没有条件而感到无可奈何\n\u003e     \n\u003e - 回天乏术：局势或病情严重已无法挽救\n\u003e     \n\u003e - 捉襟见肘：困难很多应付不过来（侧重**人力物力资源有限**，偏经济方面）\n\u003e     \n\u003e - 顾此失彼：顾了这个丢了那个（侧重**考虑不周全**）\n\u003e     \n\u003e - 左支右绌：力量不足应付了这边那边又出问题（侧重**能力有限**）\n\u003e     \n\u003e - 独木难支：一个人力量单薄维持不住全局\n\u003e     \n\u003e - 应接不暇：太繁忙应付不过来（主语是人，侧重**事物太多忙不过来**）\n\u003e     \n\n---\n\n### 十二、印象和效果\n\n**学习粗浅**：浮光掠影、走马观花、蜻蜓点水、浅尝辄止、囫囵吞枣、不求甚解\n\n**学到一点能推知更多**：举一反三、融会贯通、触类旁通\n\n\u003e **辨析**：\n\u003e \n\u003e - 浮光掠影：印象不深（侧重**抽象语境**）\n\u003e     \n\u003e - 走马观花：观察不深入细致（侧重**用眼看具体事物**，一般不形容读书）\n\u003e     \n\u003e - 蜻蜓点水：只轻轻接触表面，肤浅不深入\n\u003e     \n\u003e - 浅尝辄止：略微尝试就停止（侧重**停止**）\n\u003e     \n\u003e - 囫囵吞枣：笼统接受不加分析（侧重**不加消化**）\n\u003e     \n\u003e - 不求甚解：只求懂个大概不深入理会\n\u003e     \n\u003e - 举一反三：类推，侧重**具象事物层面**\n\u003e     \n\u003e - 融会贯通：融合贯穿获得透彻理解（侧重**融合**）\n\u003e     \n\u003e - 触类旁通：掌握规律后能推知同类事物\n\u003e     \n\n---\n\n### 十三、搭档配合\n\n**合作配合**：相辅相成、相得益彰、锦上添花、珠联璧合、互为表里\n\n**二者都好**：交相辉映、相映成趣、双峰并峙\n\n\u003e 详见第二部分\"高频成语辨析要点\"中的合作配合类表格。 互为表里：两个事物一个为表一个为里（常用语境：不正之风和贪腐问题互为表里）\n\n---\n\n### 十四、工作开展顺序\n\n并行不悖、齐头并进、双管齐下、并驾齐驱\n\n\u003e **辨析**：\n\u003e \n\u003e - 并行不悖：看似矛盾冲突但实则不矛盾可同时进行（常用语境：经济发展和环境保护并行不悖）\n\u003e     \n\u003e - 齐头并进：多种事物可以同时展开\n\u003e     \n\u003e - 双管齐下：一个事的两个方法同时进行\n\u003e     \n\u003e - 并驾齐驱：水平相当齐头并进\n\u003e     \n\n---\n\n### 十五、错误抉择和方向\n\n**错误抉择**：本末倒置、舍本逐末、喧宾夺主、因小失大、因噎废食\n\n**相悖/相反**：背道而驰、南辕北辙、分道扬镳、缘木求鱼\n\n\u003e **辨析**：\n\u003e \n\u003e - 本末倒置/舍本逐末：主次颠倒\n\u003e     \n\u003e - 因噎废食：因为怕出问题就不做了\n\u003e     \n\u003e - 背道而驰：两个主体方向相反\n\u003e     \n\u003e - 南辕北辙：一个主体行动与目的相反\n\u003e     \n\n---\n\n### 十六、错误做法（寓言故事类）\n\n拔苗助长、越俎代庖、削足适履、闭门造车、刻舟求剑、守株待兔、掩耳盗铃、邯郸学步、东施效颦、与虎谋皮\n\n\u003e **越俎代庖**适用两个语境：(1)政府不要过多干涉市场企业发展；(2)父母不要过多干涉子女。 **拔苗助长/揠苗助长**适用两个语境：(1)家长老师教育孩子；(2)政府扶持企业，需要尊重客观规律。\n\n---\n\n### 十七、教育影响批评\n\n**影响感化**：潜移默化、耳濡目染、如沐春风、润物无声、成风化人\n\n**教育和批评**：耳提面命、苦口婆心、循循善诱、诲人不倦、春风化雨、和风细雨\n\n**醒悟/唤醒**：醍醐灌顶、振聋发聩\n\n\u003e **辨析**：耳提面命意为提着耳朵当面恳切严格教导，为**褒义词**。\n\n---\n\n### 十八、工作学习状态\n\n**谨慎认真**：如履薄冰、兢兢业业\n\n**尽心钻研**：殚精竭虑、呕心沥血、苦心孤诣、废寝忘食、皓首穷经、心无旁骛、乐此不疲、挖空心思（贬义）\n\n**抓紧时间/勤奋**：夜以继日、焚膏继晷、夙兴夜寐、目不窥园\n\n**辛苦奔波**：栉风沐雨、风餐露宿、筚路蓝缕、披星戴月、摩顶放踵、胼手胝足\n\n**勤勉不懈怠**：孜孜不倦、孜孜以求\n\n\u003e **辨析**：殚精竭虑与呕心沥血通用。筚路蓝缕侧重创业艰辛。挖空心思为贬义。\n\n---\n\n### 十九、正确做法\n\n**分析问题**：条分缕析、抽丝剥茧、深入浅出\n\n**抓住关键**：纲举目张、提纲挈领、以一持万\n\n**向他人学习**：博采众长、见贤思齐\n\n**踏实做法**：量力而行、厚积薄发\n\n**勇于承担**：当仁不让、义不容辞、责无旁贷\n\n\u003e **辨析**：\n\u003e \n\u003e - 条分缕析：有条有理细细分析（侧重**一条一条分析**）\n\u003e     \n\u003e - 抽丝剥茧：分析极为细致一步一步有层次（侧重**由外到内一层层分析**）\n\u003e     \n\u003e - 分门别类：按特性分别归入门类\n\u003e     \n\u003e - 量力而行：根据自己能力做事\n\u003e     \n\u003e - 精打细算：仔细计算开支（常用在资源有限使用语境）\n\u003e     \n\n---\n\n### 二十、不能这样做\n\n过犹不及、矫枉过正、于事无补、作茧自缚、扬汤止沸、隔靴搔痒、临渊羡鱼、有恃无恐、堂而皇之、明目张胆\n\n---\n\n### 二十一、某些国家的错误做法\n\n画地为牢、以邻为壑、穿凿附会、亦步亦趋、唯利是图\n\n**旁观/得利**：隔岸观火、置身事外、袖手旁观、作壁上观、坐收渔利、坐享其成\n\n**过度开发**：竭泽而渔、杀鸡取卵、寅吃卯粮、饮鸩止渴、急功近利\n\n---\n\n### 二十二、国家安定与动荡\n\n**生活不如意**：颠沛流离、流离失所、背井离乡\n\n**社会安定**：安居乐业、海晏河清、国泰民安\n\n**国人习惯**：安土重迁\n\n---\n\n### 二十三、国际国内关系\n\n**同呼吸共命运**：休戚与共\n\n**融洽和谐**：同舟共济、同心同德、和衷共济、水乳交融、相濡以沫\n\n**和邻居的关系**：守望相助、一衣带水、唇齿相依、以邻为壑\n\n**世界局势**：波诡云谲、风云变幻、纵横捭阖\n\n**坏人坏事**：沆瀣一气、同流合污\n\n---\n\n### 二十四、政府优秀做法\n\n**有针对性**：因地制宜、量体裁衣、对症下药、有的放矢\n\n**发挥职能**：因势利导、保驾护航、穿针引线\n\n**正确做法**：广开言路、集思广益、正本清源\n\n---\n\n### 二十五、合理规划与节约\n\n开源节流、精打细算、细水长流、量入为出\n\n\u003e - 细水长流：一点一滴持之以恒做事，也比喻节约使用财物使不短缺\n\u003e     \n\u003e - 量入为出：根据收入合理安排支出\n\u003e     \n\u003e - 量力而行：根据自己能力做事\n\u003e     \n\n---\n\n### 二十六、政策措施评价\n\n**有效果**：立竿见影、一劳永逸、行之有效、一蹴而就\n\n**解决问题**：迎刃而解、事半功倍、釜底抽薪、标本兼治\n\n---\n\n### 二十七、成功与失败\n\n**轻松成功**：触手可及、唾手可得、手到擒来、信手拈来、游刃有余\n\n**没能成功**：束手无策、一筹莫展、功亏一篑、适得其反、功败垂成、失之交臂\n\n\u003e **辨析**：\n\u003e \n\u003e - 一筹莫展：遇到困难想不出一点办法\n\u003e     \n\u003e - 功亏一篑/功败垂成：快要成功时失败\n\u003e     \n\u003e - 适得其反：恰恰得到相反的结果\n\u003e     \n\u003e - 失之交臂：错过机会\n\u003e     \n\n---\n\n### 二十八、领导力\n\n**眼界高考虑全**：高屋建瓴、高瞻远瞩、深谋远虑、审时度势\n\n**筹划全面**：运筹帷幄、统筹兼顾\n\n**以身作则**：身体力行、亲力亲为、克己奉公、以身作则、上行下效、事必躬亲\n\n**始终坚持**：一以贯之、矢志不渝\n\n---\n\n### 二十九、正义精神与做法\n\n**英勇无畏**：前仆后继、视死如归、大义凛然\n\n**振作奋发**：踔厉奋发、笃行不怠、赓续前行、奋楫争先\n\n**克服困难前进**：砥砺前行、勇毅前行\n\n---\n\n### 三十、干部易犯错误\n\n**爱慕名利不务实**：好高骛远、好大喜功、沽名钓誉、附庸风雅\n\n**只顾自己**：独善其身、明哲保身\n\n**虚伪敷衍谄媚**：虚与委蛇、委曲求全、敷衍塞责、曲意逢迎、投其所好、阿谀奉承、趋炎附势、如蚁附膻\n\n**错误政策**：兴师动众、劳民伤财、朝令夕改\n\n**不认真**：粗枝大叶、大而化之、具体而微\n\n\u003e **辨析**：\n\u003e \n\u003e - 明哲保身：为了保全自己不承担应该承担的责任（多用于年轻干部）\n\u003e     \n\u003e - 独善其身：一般形容国家，面对全球化没有哪个国家能独善其身\n\u003e     \n\u003e - 好高骛远：制定过高目标，不脚踏实地\n\u003e     \n\u003e - 好大喜功：一般不用于年轻干部，是指大领导/君王追求大功绩\n\u003e     \n\n---\n\n### 三十一、对待错误的态度\n\n**谦虚接受**：从谏如流、从善如流、闻过则喜、虚怀若谷\n\n**遮掩错误**：文过饰非、怙恶不悛、欲盖弥彰\n\n**不考虑建议**：刚愎自用、固执己见\n\n**彻底改变**：洗心革面、脱胎换骨、改头换面\n\n\u003e **辨析**：脱胎换骨指彻底改过自新或事物根本性转变（对应词是改头换面：以为换汤不换药，只改外在不改表面）。\n\n---\n\n### 三十二、改变与不变\n\n**不变**：一成不变、亘古不变\n\n**改变**：改弦更张、改弦易辙\n\n**变化多快**：变幻莫测、瞬息万变\n\n**长时间繁荣**：经久不衰、长盛不衰\n\n**变化巨大**：今非昔比、天翻地覆、时过境迁、沧海桑田、斗转星移、白云苍狗、恍如隔世\n\n**难以改变**：根深蒂固、积习难改、积重难返\n\n\u003e **辨析**：\n\u003e \n\u003e - 根深蒂固：形容思想/想法不容易改变（中性词）\n\u003e     \n\u003e - 积习难改：指习惯不好改变\n\u003e     \n\u003e - 积重难返：问题越来越多越来越严重，改变不了\n\u003e     \n\n---\n\n### 三十三、顺势与造势\n\n**顺势**：顺势而为、大势所趋、势在必行、随波逐流、因陋就简\n\n**造势**：推波助澜、顺水推舟\n\n---\n\n### 三十四、自然会发生\n\n理所当然、顺理成章、天经地义、水到渠成、顺其自然\n\n---\n\n### 三十五、提早准备与补救\n\n**前期准备**：未雨绸缪、常备不懈、防患未然、防微杜渐、居安思危、曲突徙薪\n\n**准备得当无忧**：高枕无忧\n\n**出现问题补救**：临渴掘井、江心补漏、亡羊补牢\n\n---\n\n### 三十六、办公管理相关\n\n**局面不好**：尾大不掉、各行其是、各自为政\n\n**工作状态好**：如鱼得水、面面俱到、独当一面\n\n---\n\n### 三十七、空谈与虚幻\n\n**不靠谱做法**：纸上谈兵、无根之木、坐而论道、水中捞月、画饼充饥\n\n**实现不了**：空中楼阁、镜花水月、海市蜃楼\n\n---\n\n### 三十八、来者众多\n\n**形容到来**：接踵而至、络绎不绝、纷至沓来、蜂拥而至\n\n**人多/人少**：门庭若市、无人问津、门庭冷落、门可罗雀、人迹罕至\n\n**偶遇**：不期而遇、不期而至、萍水相逢\n\n**一同出现**：如影随形\n\n---\n\n### 三十九、人多热闹与孤独\n\n**人多热闹**：熙熙攘攘、人山人海、车水马龙、川流不息、万人空巷\n\n**孤独**：孑然一身、茕茕孑立、形影相吊、形单影只\n\n---\n\n### 四十、好坏掺杂\n\n**好坏都有**：参差不齐、泥沙俱下、良莠不齐、鱼龙混杂、鱼目混珠、滥竽充数\n\n**不分好坏**：买椟还珠\n\n\u003e **辨析**：\n\u003e \n\u003e - 参差不齐：水平高低不一\n\u003e     \n\u003e - 泥沙俱下/良莠不齐：好的坏的混在一起\n\u003e     \n\u003e - 鱼龙混杂：好的坏的混在一起（用于人）\n\u003e     \n\u003e - 鱼目混珠/滥竽充数：以次充好\n\u003e     \n\n---\n\n## 附录：重要易混淆成语速查\n\n### A. 表示\"变化\"的成语辨析\n\n|成语|侧重点|\n|---|---|\n|推陈出新|去旧出新（多文化）|\n|吐故纳新|扬弃旧吸收新（多事物发展/人才更替）|\n|革故鼎新|重大变革（多政治）|\n|改弦更张|改变方针计划方法|\n|改弦易辙|改变方向路线|\n|今非昔比|现在与过去相比变化大|\n|沧海桑田|世事变化巨大|\n|白云苍狗|世事变化无常|\n\n### B. 表示\"人多\"的成语辨析\n\n|成语|侧重|\n|---|---|\n|万人空巷|大家都从家里跑到街上（庆祝/观看）|\n|门庭若市|来访者众多|\n|人山人海|形容人极多|\n|车水马龙|车马往来不绝（形容繁华）|\n|川流不息|行人/车马像水流一样连续不断|\n|熙熙攘攘|人来人往热闹|\n\n### C. 表示\"衰落\"的成语辨析\n\n|成语|使用场景|\n|---|---|\n|日渐式微|古典戏曲、纸媒、传统工艺|\n|每况愈下|情况/身体越来越差|\n|江河日下|国势/事业一天天衰落|\n|后继无人|某行业无人继续从事|\n|难以为继|难以继续下去|\n\n### D. 表示\"无法做到\"的成语辨析\n\n|成语|原因|\n|---|---|\n|力有未逮|能力不够|\n|爱莫能助|想帮但无力|\n|鞭长莫及|距离太远/范围之外|\n|望洋兴叹|力量不足/条件不够|\n|回天乏术|局势已无法挽回|\n|束手无策|想不出办法|\n|一筹莫展|一点办法都没有|\n\n---\n\n\u003e **使用建议**：本笔记适合系统复习使用。建议先通读片段阅读部分掌握方法论，再学习逻辑填空技巧，最后通过成语分类表加强词汇积累。做题时遇到不确定的成语，可回到对应分类查看辨析要点。"])</script><script>self.__next_f.push([1,"7:T6c20,"])</script><script>self.__next_f.push([1,"# 花生十三 - 数量关系学习笔记\n\n\u003e **来源：** 四海公考 25下半年（花生十三）数量关系模块 22讲精华 **整理方式：** 按知识点/题型方法论组织，融合所有讲次，不保留原题\n\n---\n\n## 目录\n\n- [一、代入排除法](#%E4%B8%80%E4%BB%A3%E5%85%A5%E6%8E%92%E9%99%A4%E6%B3%95)\n    \n- [二、赋值法（特殊值法）](#%E4%BA%8C%E8%B5%8B%E5%80%BC%E6%B3%95%E7%89%B9%E6%AE%8A%E5%80%BC%E6%B3%95)\n    \n- [三、整除与倍数特性](#%E4%B8%89%E6%95%B4%E9%99%A4%E4%B8%8E%E5%80%8D%E6%95%B0%E7%89%B9%E6%80%A7)\n    \n- [四、比例法](#%E5%9B%9B%E6%AF%94%E4%BE%8B%E6%B3%95)\n    \n- [五、方程法](#%E4%BA%94%E6%96%B9%E7%A8%8B%E6%B3%95)\n    \n- [六、不定方程](#%E5%85%AD%E4%B8%8D%E5%AE%9A%E6%96%B9%E7%A8%8B)\n    \n- [七、十字交叉法](#%E4%B8%83%E5%8D%81%E5%AD%97%E4%BA%A4%E5%8F%89%E6%B3%95)\n    \n- [八、工程问题](#%E5%85%AB%E5%B7%A5%E7%A8%8B%E9%97%AE%E9%A2%98)\n    \n- [九、经济利润问题](#%E4%B9%9D%E7%BB%8F%E6%B5%8E%E5%88%A9%E6%B6%A6%E9%97%AE%E9%A2%98)\n    \n- [十、行程问题](#%E5%8D%81%E8%A1%8C%E7%A8%8B%E9%97%AE%E9%A2%98)\n    \n- [十一、排列组合](#%E5%8D%81%E4%B8%80%E6%8E%92%E5%88%97%E7%BB%84%E5%90%88)\n    \n- [十二、概率问题](#%E5%8D%81%E4%BA%8C%E6%A6%82%E7%8E%87%E9%97%AE%E9%A2%98)\n    \n- [十三、容斥原理](#%E5%8D%81%E4%B8%89%E5%AE%B9%E6%96%A5%E5%8E%9F%E7%90%86)\n    \n- [十四、几何问题](#%E5%8D%81%E5%9B%9B%E5%87%A0%E4%BD%95%E9%97%AE%E9%A2%98)\n    \n- [十五、最值问题](#%E5%8D%81%E4%BA%94%E6%9C%80%E5%80%BC%E9%97%AE%E9%A2%98)\n    \n- [十六、溶液问题](#%E5%8D%81%E5%85%AD%E6%BA%B6%E6%B6%B2%E9%97%AE%E9%A2%98)\n    \n- [十七、数列与等差数列](#%E5%8D%81%E4%B8%83%E6%95%B0%E5%88%97%E4%B8%8E%E7%AD%89%E5%B7%AE%E6%95%B0%E5%88%97)\n    \n- [十八、日期星期与周期](#%E5%8D%81%E5%85%AB%E6%97%A5%E6%9C%9F%E6%98%9F%E6%9C%9F%E4%B8%8E%E5%91%A8%E6%9C%9F)\n    \n- [十九、牛吃草问题](#%E5%8D%81%E4%B9%9D%E7%89%9B%E5%90%83%E8%8D%89%E9%97%AE%E9%A2%98)\n    \n- [二十、鸡兔同笼、方阵与植树](#%E4%BA%8C%E5%8D%81%E9%B8%A1%E5%85%94%E5%90%8C%E7%AC%BC%E6%96%B9%E9%98%B5%E4%B8%8E%E6%A4%8D%E6%A0%91)\n    \n- [二十一、余数与平方数](#%E4%BA%8C%E5%8D%81%E4%B8%80%E4%BD%99%E6%95%B0%E4%B8%8E%E5%B9%B3%E6%96%B9%E6%95%B0)\n    \n- [二十二、趣味杂题](#%E4%BA%8C%E5%8D%81%E4%BA%8C%E8%B6%A3%E5%91%B3%E6%9D%82%E9%A2%98)\n    \n- [二十三、考场蒙猜技巧](#%E4%BA%8C%E5%8D%81%E4%B8%89%E8%80%83%E5%9C%BA%E8%92%99%E7%8C%9C%E6%8A%80%E5%B7%A7)\n    \n\n---\n\n## 一、代入排除法\n\n### 核心思想\n\n将选项逐一代入题干条件进行验证，排除不符合的选项。\n\n### 适用场景\n\n- 选项为具体数值，代入后计算简便\n    \n- 方程难以列或解，但代入验证快\n    \n- 结合整除特性先缩小范围再代入\n    \n- 问\"最少/最多\"时从极端选项开始代入\n    \n\n### 使用技巧\n\n\u003e **[方法]** 问\"最少\"从最小选项开始代入，问\"最多\"从最大选项开始。\n\n- 代入时优先选择容易计算的选项（如整数、整除的）\n    \n- 结合奇偶性、尾数、倍数等先排除明显不可能的选项\n    \n- 对于工程问题，代入效率值比代入时间更方便\n    \n\n\u003e **[易错]** 工程问题中代入效率值时，注意验证的是工作总量是否等于设定值，而非时间是否匹配。\n\n---\n\n## 二、赋值法（特殊值法）\n\n### 核心思想\n\n当题干给出的都是比例关系，或所求为比例关系时，对某些未知量赋予具体数值，简化计算。\n\n### 五大适用情况\n\n|情况|说明|示例|\n|---|---|---|\n|**恒成立问题**|题干条件对任意值成立（包括几何）|几何题赋值边长为具体数字|\n|**比例进比例出**|已知为比例关系，所求也是比例关系|利润率题赋值成本为100|\n|**不定方程求和**|3个未知数2个方程，求xyz之和|赋值一个未知数为0求解|\n|**盐水浓度类**|赋溶质为浓度的最小公倍数|浓度24%和36%，赋溶质72|\n|**工程问题**|赋工作总量为时间的最小公倍数|甲8天乙10天，赋总量40|\n\n### 关键口诀\n\n\u003e **[积累]** \"问什么设什么\" —— 经济利润中问成本设成本；\"A是B的多少倍\" —— 直接把B设为1。\n\n\u003e **[注意]** 赋值法的关键是选择合适的赋值对象，赋值后需要验证结果是否与选项一致。赋值的量应便于计算（整数、公倍数等）。\n\n---\n\n## 三、整除与倍数特性\n\n### 整除判定规则\n\n\u003e **[公式]**\n\u003e \n\u003e - 被 **2** 整除：末位为偶数\n\u003e     \n\u003e - 被 **5** 整除：末位为0或5\n\u003e     \n\u003e - 被 **3** 整除：各位数字之和是3的倍数\n\u003e     \n\u003e - 被 **9** 整除：各位数字之和是9的倍数\n\u003e     \n\u003e - 被 **4** 整除：末两位能被4整除\n\u003e     \n\u003e - 被 **25** 整除：末两位能被25整除\n\u003e     \n\u003e - 被 **8** 整除：末三位能被8整除\n\u003e     \n\u003e - 被 **125** 整除：末三位能被125整除\n\u003e     \n\n### 核心定理\n\n\u003e **[公式]** 若 a、b 分别为 X 的倍数，则 a+b、a-b 也都为 X 的倍数。\n\n### 倍数特性在不定方程中的应用\n\n\u003e **[公式]** 在方程 `ax + by = c` 中：若 c 是 b 的倍数，则 ax 也是 b 的倍数，即 x 是 b 的倍数。同理 y 是 a 的倍数。\n\n### 利用整除特性确定人数/数量\n\n\u003e **[积累]** 当题干出现百分比时，将其化为最简分数，从而确定总量的倍数关系：\n\u003e \n\u003e - 12% = 3/25 → 总量为25的倍数\n\u003e     \n\u003e - 64% = 16/25 → 总量为25的倍数\n\u003e     \n\u003e - 87.5% = 7/8 → 对应量为8的倍数\n\u003e     \n\u003e - 21% = 21/100 → 对应部分为100的倍数（或约分后确定）\n\u003e     \n\n### 纯整除问题\n\n\u003e **[方法]** 纯整除问题优先看 **3、9、2、5**。利用数字和判定法（3和9）配合末位判定法（2和5），可快速缩小范围。\n\n---\n\n## 四、比例法\n\n### 行程问题比例关系\n\n\u003e **[公式]**\n\u003e \n\u003e - 路程一定 → **速度和时间成反比**\n\u003e     \n\u003e - 速度一定 → **时间和距离成正比**\n\u003e     \n\u003e - 时间一定 → **速度和距离成正比**\n\u003e     \n\n### \"415份数法\"\n\n\u003e **[方法]** 当题干给出\"提高/降低百分之几\"时，将原值设为整数份：\n\u003e \n\u003e - 速度提高20% → V_原:V_新 = 5:6 → T_原:T_新 = 6:5\n\u003e     \n\u003e - 速度提高25% → V_原:V_新 = 4:5 → T_原:T_新 = 5:4\n\u003e     \n\u003e \n\u003e 利用时间差（份数差）对应实际时间差，求出每份时间，进而求解。\n\n### 十字交叉法（盐水思想）\n\n\u003e **[公式]** 本质是加权平均的快捷算法：`A的量 / B的量 = |平均值 - B| / |平均值 - A|`\n\n\u003e **[注意]** 十字交叉求的是\"量之比\"，具体是什么量取决于分母 —— **\"求谁就将谁放在分母\"**。\n\n---\n\n## 五、方程法\n\n### 三步法\n\n\u003e **[公式]**\n\u003e \n\u003e 1. **设未知数** —— 找等式关系，设关键量为x\n\u003e     \n\u003e 2. **列方程** —— 根据题干等量关系列等式\n\u003e     \n\u003e 3. **解方程** —— 求解并根据题意作答\n\u003e     \n\n### 设未知数的技巧\n\n- **问什么设什么：** 最直接，减少转化步骤\n    \n- **利用最小公倍数设：** 当出现倍数关系时（如\"多50%\"），设第一天2x，第二天3x\n    \n- **比例设份法：** 如甲乙丙比为5:4:3:2，设为5x、4x、3x、2x\n    \n- **总量设1法：** 求比例时，将总量设为1或100\n    \n\n### 找等式关系\n\n|关系类型|表达方式|\n|---|---|\n|差值关系|\"A比B多X\" → A - B = X|\n|倍数关系|\"A是B的N倍\" → A = NB|\n|总和关系|\"共N个\" → 各项之和 = N|\n|变化前后|\"调度后\" → 列调度后的表达式|\n\n\u003e **[易错]** \"各镇发放的大米总量相同\"，问\"三个镇共发放多少\"时，答案是各镇的 **3倍**。选项中通常会设置一个\"单镇量\"作为干扰项。\n\n---\n\n## 六、不定方程\n\n### 三大方法\n\n\u003e **[公式]**\n\u003e \n\u003e - **奇偶法：** 分析等式两边的奇偶性\n\u003e     \n\u003e - **尾数法：** 分析等式两边的尾数特征\n\u003e     \n\u003e - **倍数法：** 利用整除特性确定变量范围（最重要）\n\u003e     \n\n### 解题步骤\n\n1. 列出不定方程（未知数个数 \u003e 方程个数）\n    \n2. 观察系数特征，选择合适方法\n    \n3. 利用奇偶/尾数/倍数缩小范围\n    \n4. 代入验证或结合选项求解\n    \n\n### 消元技巧\n\n\u003e **[方法]** 当有两个方程时，先消元得到一个不定方程，再用上述方法求解。\n\n### 经典应用\n\n\u003e **[积累]** 整数型不定方程（如买笔、装袋问题），优先利用小数部分确定某个变量的取值范围，再用倍数法缩小其他变量。例如：`1.7x + 3y + 4z = 40.6`，小数0.6来自1.7x → x尾数为8。\n\n---\n\n## 七、十字交叉法\n\n### 核心公式\n\n\u003e **[公式]** `A的量 / B的量 = |混合均值 - B值| / |混合均值 - A值|`\n\n### 应用场景\n\n|场景|A值|B值|混合均值|量之比含义|\n|---|---|---|---|---|\n|溶液混合|浓度A|浓度B|混合浓度|溶液量之比|\n|平均成绩|A组均分|B组均分|总均分|人数之比|\n|利润率混合|利润率A|利润率B|总利润率|**成本之比**|\n|增长率混合|增长率A|增长率B|总增长率|**基期量之比**|\n\n\u003e **[易错]** 增长率问题中，十字交叉求出的是 **基期量之比**。要求现期量之比还需再乘以各自的增长率：`现期比 = 基期比 × (1+R_A) : (1+R_B)`\n\n\u003e **[注意]** 十字交叉法的使用前提：必须是 **两个量混合成一个平均值** 的场景。整体（混合后）的值一定介于两个部分值之间。\n\n---\n\n## 八、工程问题\n\n### 基本公式\n\n\u003e **[公式]**\n\u003e \n\u003e - `工作总量 = 效率 × 时间`\n\u003e     \n\u003e - 合作完工：`总工作时间 = 总工作量 / 总效率`\n\u003e     \n\n### 三大类型解法\n\n|已知条件|方法|\n|---|---|\n|**给时间**（单独完成天数）|设工作总量为各时间的最小公倍数，求各效率|\n|**给效率比**|直接将效率比当作效率值使用|\n|**给不同完工情况**|利用工作总量相等列方程，求效率比|\n\n### 给时间型（最常见）\n\n\u003e **[方法]**\n\u003e \n\u003e 1. 设工作总量为所有时间的最小公倍数\n\u003e     \n\u003e 2. 各效率 = 总量 / 单独完成时间\n\u003e     \n\u003e 3. 合作效率 = 各效率之和\n\u003e     \n\u003e 4. 根据实际工作情况列式求解\n\u003e     \n\n### 给效率比型\n\n\u003e **[方法]** 直接将效率比当作效率值。如\"甲比乙高25%\" → 设甲效率5，乙效率4。\n\n### 给不同完工情况型\n\n\u003e **[方法]** 利用\"不同方式完成同一工作，工作总量相等\"列方程。\n\n### 重要注意事项\n\n\u003e **[注意]** 合作完工核心思想：判断每人实际工作了多长时间。\"三人同时开始、同时结束\" → 直接用 总工作量/总效率。\n\n\u003e **[易错]** 当题干说\"甲先做X天，然后甲乙合作Y天，剩余由乙单独Z天完成\"时，要分段计算各阶段完成的工作量。\n\n\u003e **[积累]** 求\"a的效率是b的多少倍\"时，把b的效率视为1，求出a的值即为倍数，不需算出具体效率。\n\n---\n\n## 九、经济利润问题\n\n### 基础公式\n\n\u003e **[公式]**\n\u003e \n\u003e - `收入 = 成本 + 利润`\n\u003e     \n\u003e - `利润 = 售价 - 成本`\n\u003e     \n\u003e - `成本利润率 = 利润 / 成本`（数量关系常用）\n\u003e     \n\u003e - `收入利润率 = 利润 / 收入`（资料分析常用）\n\u003e     \n\u003e - `N折 = 0.N × 定价`\n\u003e     \n\u003e - **定价 ≠ 实际销售价格**\n\u003e     \n\n### 分批销售\n\n\u003e **[方法]** 按不同阶段分别计算收入/利润，再列总和等式。设成本为x，定价为1（或具体数字），按不同折扣和销量列方程。\n\n### 阶梯计费\n\n\u003e **[方法]** 分段计算费用，注意\"不满X按X计\"的取整规则。\n\n### 函数最值（涨价/降价求最大利润）\n\n\u003e **[公式]** 涨价x元，销量减少kx个： `总利润 Y = (单个利润 + x)(销量 - kx)`\n\u003e \n\u003e 令 Y=0 得两个根 x1、x2\n\u003e \n\u003e **最大值点：** `x = (x1 + x2) / 2`（抛物线顶点公式）\n\n### 增长率相关\n\n\u003e **[公式]**\n\u003e \n\u003e - **间隔增长率：** `R_间隔 = R1 + R2 + R1 × R2`\n\u003e     \n\u003e - **年均增长率：** `现期/基期 = (1+R)^n`\n\u003e     \n\u003e - **乘积增长率：** `R_总 = R1 + R2 + R1 × R2`\n\u003e     \n\u003e - **比值增长率：** `R = (R_A - R_B) / (1 + R_B)`\n\u003e     \n\n\u003e **[易错]** \"减少1/6后\" → 今年是5份，去年是6份（不是今年=去年×5/6，而是去年=今年÷5/6=今年×6/5）。\n\n---\n\n## 十、行程问题\n\n### 基础公式\n\n\u003e **[公式]**\n\u003e \n\u003e - `S = V × t`\n\u003e     \n\u003e - **相遇：** `S_和 = (V1 + V2) × T`\n\u003e     \n\u003e - **追及：** `ΔS = ΔV × T`\n\u003e     \n\u003e - **环形追及：** 多跑一圈即为追上\n\u003e     \n\n### 多次相遇\n\n\u003e **[公式]** **全程个数 = 2n - 1**（n为相遇次数）\n\u003e \n\u003e 第n次相遇时，两人走过的路程之和 = (2n-1) × 全程距离\n\n\u003e **[注意]** 计算\"全程个数\"后除以全程距离，如果不是整数，说明正在下一次相遇的路上，n需向下取整。\n\n### 流水行船\n\n\u003e **[公式]**\n\u003e \n\u003e - `V_顺 = V_船 + V_水`\n\u003e     \n\u003e - `V_逆 = V_船 - V_水`\n\u003e     \n\u003e - `V_船 = (V_顺 + V_逆) / 2`\n\u003e     \n\u003e - `V_水 = (V_顺 - V_逆) / 2`\n\u003e     \n\n\u003e **[易错]** \"工具包掉入水中\"类问题：工具包以水速漂流。以水为参照物，船往返时间相等。追及距离 = 2 × 水速 × 丢失时间。\n\n### 火车过桥\n\n\u003e **[公式]**\n\u003e \n\u003e - **单位换算：** `km/h ÷ 3.6 = m/s`\n\u003e     \n\u003e - **上桥到下桥：** `S = 桥长 + 车长`\n\u003e     \n\u003e - **全在桥上：** `S = 桥长 - 车长`\n\u003e     \n\n### 匀加速/匀减速\n\n\u003e **[公式]**\n\u003e \n\u003e - **匀加速平均速度：** `V_平均 = (V_初 + V_末) / 2`\n\u003e     \n\u003e - **等距离平均速度：** `V_平均 = 2 × V1 × V2 / (V1 + V2)`\n\u003e     \n\n### 比例法在行程中的应用\n\n\u003e **[方法]**\n\u003e \n\u003e - 路程相同：速度比 = 时间的反比\n\u003e     \n\u003e - 速度相同：路程比 = 时间比\n\u003e     \n\u003e - 时间相同：路程比 = 速度比\n\u003e     \n\n---\n\n## 十一、排列组合\n\n### 基本原则\n\n\u003e **[公式]**\n\u003e \n\u003e - **有序为排列(A)，无序为组合(C)**\n\u003e     \n\u003e - `分类用加法，分步用乘法`\n\u003e     \n\u003e - **特殊入手：** 先安排有特殊要求的元素\n\u003e     \n\u003e - **全部减不符：** 全部可能 - 不符合要求的 = 符合要求的\n\u003e     \n\n### 核心方法总结\n\n|问题类型|方法|公式/思路|\n|---|---|---|\n|**相邻问题**|捆绑法|将相邻元素捆绑为一个整体，再排列，注意内部排列|\n|**不相邻问题**|插空法|先排无限制元素（n个形成n+1个空），再在空位中插入|\n|**环形排列**|固定一人|n人环形排列 = A(n-1)^(n-1)|\n|**平均分堆**|去重复顺序|先选各组，再除以组数的阶乘|\n|**定序问题**|除序法/插空法|全排列 / 定序元素内部排列数|\n|**相同元素分配**|插板法|n个相同分k人，每人至少1个：C(n-1, k-1)|\n|**错位排序**|记结论|1→0, 2→1, 3→2, 4→9, 5→44, 6→265|\n\n### 插板法详解\n\n\u003e **[公式]**\n\u003e \n\u003e - n个相同元素分给k个人，每人至少1个 → `C(n-1, k-1)`\n\u003e     \n\u003e - 不要求\"至少1个\" → 先每人\"借\"1个 → `C(n+k-1, k-1)`\n\u003e     \n\u003e - 有\"至少m个\"要求 → 先给每人m-1个，剩余用插板法\n\u003e     \n\n### 错位排序\n\n\u003e **[公式]** 必须记住的结论：\n\u003e \n\u003e - 1个错位 = **0**\n\u003e     \n\u003e - 2个错位 = **1**\n\u003e     \n\u003e - 3个错位 = **2**\n\u003e     \n\u003e - 4个错位 = **9**\n\u003e     \n\u003e - 5个错位 = **44**\n\u003e     \n\u003e - 6个错位 = **265**\n\u003e     \n\n### 重复排列\n\n\u003e **[方法]** 每个选择不影响其他选择（可重复选择），总数 = 每个选择的可选数相乘。如：6个年级各选1个科技馆（6选1可重复）→ 6^6。\n\n---\n\n## 十二、概率问题\n\n### 基础公式\n\n\u003e **[公式]**\n\u003e \n\u003e - `P = 符合要求的情况数 / 所有可能的情况数`\n\u003e     \n\u003e - **独立事件同时发生：** 各概率相乘\n\u003e     \n\u003e - **分类用加法，分步用乘法**\n\u003e     \n\n### 两种策略\n\n|策略|适用场景|\n|---|---|\n|**正面分情况**|情况较少且明确|\n|**全部减不符**|正面情况复杂，\"至少一个\"类问题 → 1 - \"全部都不\"|\n\n### 比赛概率模型\n\n\u003e **[方法]** 三局两胜/五局三胜：\n\u003e \n\u003e - 2:0赢 → 直接连赢两场\n\u003e     \n\u003e - 2:1赢 → **输的那场一定在前两场中**（最后一场必须赢才能结束）\n\u003e     \n\u003e - 3:2赢 → 输的两场在前四场中 `C(4,2)`\n\u003e     \n\u003e - 反向思考：`1 - 对手赢的概率`\n\u003e     \n\n### 二人同组概率\n\n\u003e **[积累]** 先给第一个人安排位置，再看第二个人有多少种可能位置，其中几个和第一个人同队。概率 = 同队位置数 / 可选位置总数。\n\n\u003e **[易错]** 抽奖/抽签问题中，每个人中奖概率相同（与先后顺序无关）。10人抽1个奖，无论第几个抽，概率都是1/10。\n\n\u003e **[积累]** 概率问题中分子分母都能约分掉——不需要考虑内部不相关的排序。\n\n---\n\n## 十三、容斥原理\n\n### 核心公式\n\n\u003e **[公式]**\n\u003e \n\u003e - **两集合：** `总人数 - 圈外 = A + B - 两者都有`\n\u003e     \n\u003e - **三集合：** `总人数 - 圈外 = A + B + C - 只参加两项的 - 2 × 三项都参加的`\n\u003e     \n\u003e - **隐藏公式：** `0次 + 1次 + 2次 + 3次 = 总人数`\n\u003e     \n\n### 反向构造（容斥中的最值）\n\n\u003e **[方法]** 问\"至少有多少人三项都做了\" → 反着想：让\"没做\"的尽量多\n\u003e \n\u003e `三项都做的最少 = 总人数 - (没做A的 + 没做B的 + 没做C的)`\n\n### 结合整除特性\n\n\u003e **[积累]** 当题干出现百分比（如\"12%的人两科都不及格\"），先利用整除特性确定总人数，再代入公式计算。\n\n### 画图法\n\n\u003e **[方法]** 对于复杂容斥问题，画文氏图标注各区域人数，列方程求解。\n\n\u003e **[注意]** \"中间交叉部分不为零\" —— 设两项的人数为y时，y不能太大导致三项人数为负。\n\n---\n\n## 十四、几何问题\n\n### 平面几何公式\n\n|图形|周长|面积|\n|---|---|---|\n|正方形|4a|a²|\n|长方形|2(a+b)|ab|\n|三角形|a+b+c|½ah|\n|正三角形|3a|(√3/4)a²|\n|圆|2πr|πr²|\n|扇形|nπr/180|nπr²/360 = lr/2|\n|梯形|a+b+c+d|(上底+下底)×高/2|\n|菱形|4a|对角线×对角线/2|\n\n### 立体几何公式\n\n|图形|表面积|体积|\n|---|---|---|\n|正方体|6a²|a³|\n|球|4πr² = πD²|(4/3)πr³|\n|圆柱|2πr² + 2πrh|πr²h|\n|圆锥|πr² + πrl|(1/3)Sh|\n|棱锥|侧面积+底面积|(1/3)Sh|\n\n### 等比放缩\n\n\u003e **[公式]**\n\u003e \n\u003e - 长度比 = 1:n\n\u003e     \n\u003e - **面积比 = 1:n²**\n\u003e     \n\u003e - **体积比 = 1:n³**\n\u003e     \n\n### 几何最值\n\n\u003e **[积累]**\n\u003e \n\u003e - 矩形周长一定 → **正方形面积最大**\n\u003e     \n\u003e - 矩形面积一定 → **正方形周长最短**\n\u003e     \n\u003e - 面积一定 → 越接近球，体积越大\n\u003e     \n\u003e - 体积一定 → 越接近球，表面积越小\n\u003e     \n\n### 最短路径\n\n\u003e **[方法]** \"将军饮马\"模型：找对称点，将折线转化为直线。跨河问题：先\"抽掉\"河道算直线距离，再把河道长度加回来。\n\n### 三角形核心知识\n\n- **常见勾股数：** 3-4-5、5-12-13、8-15-17、7-24-25\n    \n- **30-60-90三角形：** 边长比 1:√3:2\n    \n- **45-45-90三角形：** 边长比 1:1:√2\n    \n- **相似三角形：** 等高时底之比 = 面积之比\n    \n\n\u003e **[方法]** 几何题中条件都是比例关系、求的也是比例关系 → 用赋值法，给边长赋具体数值。\n\n---\n\n## 十五、最值问题\n\n### 和定最值\n\n\u003e **[公式]**\n\u003e \n\u003e - 问谁就把谁设成x\n\u003e     \n\u003e - **问最多 → 其他人尽量少**（用x-1表示）\n\u003e     \n\u003e - **问最少 → 其他人尽量多**（用x+1表示）\n\u003e     \n\n\u003e **[注意]** 取整规则：\n\u003e \n\u003e - 设的是\"最少\"的量 → **向上取整**\n\u003e     \n\u003e - 设的是\"最多\"的量 → **向下取整**\n\u003e     \n\n\u003e **[易错]** 注意题干是否说\"各不相同\" —— 没说各不相同意味着其他人可以并列。\n\n### 最不利极限题\n\n\u003e **[公式]** 常见问法：\"至少……才能保证……\"\n\u003e \n\u003e **答案 = 最不利情况 + 1**\n\n\u003e **[方法]** 找到\"最不利情况\"（最倒霉的情况），即差一点就满足条件的最大数量，再加1。\n\n### 反向构造（容斥最值）\n\n\u003e **[公式]** `三项都满足的至少 = 总人数 - (不满足A + 不满足B + 不满足C)`\n\n---\n\n## 十六、溶液问题\n\n### 核心公式\n\n\u003e **[公式]**\n\u003e \n\u003e - `浓度 = 溶质 / 溶液`\n\u003e     \n\u003e - `溶质 = 溶液 × 浓度`\n\u003e     \n\u003e - 加水/蒸发：**溶质不变**\n\u003e     \n\u003e - 混合：混合后溶质 = 各溶液溶质之和\n\u003e     \n\n### 三种解法\n\n|方法|适用场景|操作|\n|---|---|---|\n|方程法|通用|根据溶质不变列方程|\n|赋值法|浓度已知|赋溶质为浓度分母的最小公倍数|\n|十字交叉法|两种溶液混合|用十字交叉求量之比|\n\n\u003e **[积累]** 反复倒出/加满问题：每次操作后浓度按比例变化，逐步追踪溶质和溶液量的变化即可。\n\n---\n\n## 十七、数列与等差数列\n\n### 等差数列核心公式\n\n\u003e **[公式]**\n\u003e \n\u003e - **通项公式：** `a_n = a_1 + (n-1)d`\n\u003e     \n\u003e - **求和公式：** `S_n = n(a_1 + a_n)/2 = n × 中间项`\n\u003e     \n\n### 重要性质\n\n\u003e **[积累]**\n\u003e \n\u003e - **奇数项等差数列：** 平均数 = 等差中项，`S_n = n × 中项`\n\u003e     \n\u003e - **等差中项：** `(a_1 + a_n) / 2`\n\u003e     \n\u003e - 若 m+n = k+i，则 `a_m + a_n = a_k + a_i`\n\u003e     \n\u003e - **秒杀技巧：** 求n项之和时，答案一定是n的倍数\n\u003e     \n\n### 等比数列\n\n\u003e **[公式]**\n\u003e \n\u003e - **通项公式：** `a_n = a_1 × q^(n-1)`\n\u003e     \n\u003e - **求和公式：** `S_n = a_1(1-q^n)/(1-q)`\n\u003e     \n\u003e - **性质：** `a_n² = a_(n-1) × a_(n+1)`\n\u003e     \n\n### 必背平方数\n\n\u003e **[积累]** 1²=1, 2²=4, 3²=9, ..., 10²=100, 11²=121, 12²=144, 13²=169, 14²=196, 15²=225, 16²=256, 17²=289, 18²=324, 19²=361, 20²=400\n\n---\n\n## 十八、日期星期与周期\n\n### 基础规则\n\n\u003e **[公式]**\n\u003e \n\u003e - **平年365天 = 52周余1天** → 同日期明年星期+1\n\u003e     \n\u003e - **闰年366天 = 52周余2天** → 同日期明年星期+2\n\u003e     \n\u003e - **闰年：** 能被4整除（世纪年需被400整除）\n\u003e     \n\n### 跨月计算三步法\n\n\u003e **[方法]**\n\u003e \n\u003e 1. **粗算：** 月数 × 30天\n\u003e     \n\u003e 2. **修正：** 大月(31天)每月+1天，2月平年28天(-2)闰年29天(-1)\n\u003e     \n\u003e 3. **加日期差：** 目标日 - 起始日\n\u003e     \n\u003e \n\u003e 最后除以7看余数，向后推\n\n### 跨多年计算\n\n\u003e **[方法]** 每过一年按+1天计算，再数中间经过几个闰年额外+几天。\n\n### 周期循环\n\n\u003e **[公式]**\n\u003e \n\u003e - **第一种考法：** 周期拿掉看余数\n\u003e     \n\u003e - **第二种考法：** 两个周期融合 → 取最小公倍数\n\u003e     \n\n### \"唯一性\"确定星期\n\n\u003e **[方法]** 月份天数 = 4周余X天 → 四个整周有固定工作日数 → 多余天数中需满足额外工作日数 → 确定多余天数的位置 → 确定具体星期。\n\n\u003e **[易错]** \"每隔n天\" = \"每n+1天\"。\"每隔4天去一次\" = \"每5天去一次\"。\n\n---\n\n## 十九、牛吃草问题\n\n### 核心模型\n\n\u003e **[公式]**\n\u003e \n\u003e - **口诀：** \"白吃牛、原有草、问中数字少不了\"\n\u003e     \n\u003e - `白吃牛 = 自然增长速率`\n\u003e     \n\u003e - `原有草 = (牛数 - 白吃牛) × 天数`\n\u003e     \n\u003e - `所需天数 = 原有草 / (实际干活牛数 - 白吃牛)`\n\u003e     \n\n### 标准解题步骤\n\n\u003e **[方法]**\n\u003e \n\u003e 1. 设每台机器/每人效率为1\n\u003e     \n\u003e 2. 利用两组已知条件求\"白吃牛\"和\"原有草\"\n\u003e     \n\u003e 3. 代入第三组条件求解\n\u003e     \n\n### 常见变形\n\n- 蓄水池 + 河水流入 → 抽水机问题\n    \n- 河道淤泥 + 上游新泥沙 → 挖沙机问题\n    \n- 排队人数 + 新增排队者 → 窗口问题\n    \n- 草匀速生长 → 牛/羊吃草（1牛=2羊需单位换算）\n    \n\n\u003e **[易错]** 当题干说\"新增人数比假设多25%\"时，白吃牛要乘以1.25，而不是在最终结果上调整。\n\n---\n\n## 二十、鸡兔同笼、方阵与植树\n\n### 鸡兔同笼\n\n\u003e **[公式]** `鸡 = (最大可能总分 - 实际总分) / 腿数之差`\n\u003e \n\u003e 适用：得失分问题、工资问题、两种规格混合问题\n\n\u003e **[积累]** \"答对得3分，答错扣2分，共100题得285分\" → 全对300分，差15分，每题得失差5分 → 错题 = 15/5 = 3 → 对题 = 97。\n\n### 方阵问题\n\n\u003e **[公式]**\n\u003e \n\u003e - 实心方阵：总数 = 边长²\n\u003e     \n\u003e - **相邻两圈差 = 8**（正方形方阵）\n\u003e     \n\u003e - 最外层 = 4 × 边长 - 4\n\u003e     \n\u003e - 方阵人数必须是 **完全平方数**\n\u003e     \n\n### 植树问题\n\n\u003e **[公式]**\n\u003e \n\u003e - 两端都植：棵数 = 间隔数 + 1\n\u003e     \n\u003e - 一端植一端不植：棵数 = 间隔数\n\u003e     \n\u003e - 两端都不植：棵数 = 间隔数 - 1\n\u003e     \n\u003e - **重合点：** 找最小公倍数确定重合位置\n\u003e     \n\n\u003e **[注意]** \"除不完有余数\"时，相当于一端植树一端不植树。长方形/正方形网格：长方向棵数 × 宽方向棵数。\n\n---\n\n## 二十一、余数与平方数\n\n### 余数问题\n\n|特征|口诀|被除数表示|实例|\n|---|---|---|---|\n|**余同**|余同取余|最小公倍数×n + 余数|除3余1、除5余1 → 30n+1|\n|**和同**|和同加和|最小公倍数×n + 和|除7余1、除6余2 → 210n+8|\n|**差同**|差同减差|最小公倍数×n - 差|除7余5、除6余4 → 42n-2|\n\n\u003e **[积累]** \"除9余7，除11余9\" → 差同（都差2）→ 99n-2。\n\n### 平方数应用\n\n\u003e **[积累]**\n\u003e \n\u003e - \"年龄的平方等于年份\" → 在21世纪，45²=2025，所以2025年45岁\n\u003e     \n\u003e - \"每种台数 = 种类数\" → 总数 = 种类数² → 是平方数\n\u003e     \n\u003e - 平方数 + 质数条件 → 逐一验证范围内的平方数\n\u003e     \n\n---\n\n## 二十二、趣味杂题\n\n### 比赛问题\n\n\u003e **[方法]** **淘汰赛：**\n\u003e \n\u003e - 每场淘汰一支队伍 → n支队伍决出冠军需 **n-1** 场比赛\n\u003e     \n\u003e - 偶数队伍全部比赛；奇数队伍一队轮空\n\u003e     \n\u003e - \"至少参加几场\" → 每次轮空都轮到该队\n\u003e     \n\u003e \n\u003e **单循环赛：** 总场数 = C(n,2) = n(n-1)/2，每队打n-1场\n\u003e \n\u003e **积分赛：** 总得分 = 3×(胜负场数) + 2×(平局场数)\n\n### 钟表问题\n\n\u003e **[公式]** 快/慢表恢复标准时间：\n\u003e \n\u003e - 快表快一圈(720分钟)需天数 = 720 / 每天快分钟数\n\u003e     \n\u003e - 慢表慢一圈(720分钟)需天数 = 720 / 每天慢分钟数\n\u003e     \n\u003e - **两表同时恢复：** 取两周期的最小公倍数\n\u003e     \n\n\u003e **[方法]** 坏表问题：`正常表时间 / 坏表时间 = 60 / 坏表每小时走的分钟数`\n\n### 统筹优化\n\n\u003e **[积累]**\n\u003e \n\u003e - **最短作业优先：** 时间短的排前面，总等待时间最小\n\u003e     \n\u003e - **并行处理：** 等待结果时做其他任务\n\u003e     \n\u003e - **合并操作：** 多个科室的交费、取药可以合并\n\u003e     \n\u003e - **费用优化：** 谁便宜多用谁，但需满足时间约束\n\u003e     \n\n### 天平称重\n\n\u003e **[公式]** n个硬币找1个假币：最少称量次数 = **log₃(n) 向上取整**\n\u003e \n\u003e 方法：每次尽量三等分，称两组等量的，缩小到1/3范围\n\n### 运输调配\n\n\u003e **[方法]** 设一个方向的运输量为x，列总费用不等式，解出x范围，数整数解个数。\n\n---\n\n## 二十三、考场蒙猜技巧\n\n\u003e **[注意]** 蒙题有风险，高手不建议蒙。以下仅作为考场应急。\n\n### 策略总结\n\n|策略|说明|\n|---|---|\n|**倍数蒙**|题干有\"3倍关系\"，答案往往是某选项的3倍|\n|**分母特性**|概率题分母通常含关键数字的因子|\n|**符合常识**|几何题可借助工具按比例估算|\n|**赋值秒杀**|全是比例关系 → 赋具体数值快速计算|\n|**代入排除**|从最容易计算的选项开始，利用奇偶/尾数先排除|\n\n### 考场原则\n\n\u003e **[积累]**\n\u003e \n\u003e - 先做会做的题，不会的做标记\n\u003e     \n\u003e - 每道题不超过2分钟，超时果断跳过\n\u003e     \n\u003e - 数量关系整体放最后做\n\u003e     \n\u003e - 优先挑简单题型（工程、经济利润、容斥等）\n\u003e     \n\n---\n\n\u003e **笔记整理说明：** 本笔记基于花生十三（四海公考）25下半年数量关系22讲随堂笔记整理，按知识点和题型方法论重新组织，覆盖全部22讲的核心方法、公式、技巧和注意事项。重点提取了解题方法论，未保留原题。"])</script><script>self.__next_f.push([1,"8:T3ed1,"])</script><script>self.__next_f.push([1,"# 资料分析 - 系统学习笔记\n\n\u003e **来源**：花生13（四海公考）25下半年资料分析课程 **说明**：融合全部10讲内容，按知识点/方法论组织，不保留原题\n\n---\n\n## 一、基础概念与核心公式\n\n### 1.1 ABRX 四量关系\n\n资料分析的核心框架围绕四个量展开：\n\n|符号|含义|说明|\n|---|---|---|\n|**A**|基期（前期）|比较的基准值|\n|**B**|现期（本期）|当前时期的值|\n|**X**|增长量|绝对差值|\n|**R**|增长率|相对差异|\n\n\u003e **ABRX 核心公式组**\n\u003e \n\u003e - `B = A + X = A(1 + R)`\n\u003e     \n\u003e - `X = B - A = AR = BR/(1+R)`\n\u003e     \n\u003e - `R = X/A = (B-A)/A = B/A - 1`\n\u003e     \n\u003e - `A = B - X = B/(1+R) = X/R`\n\u003e     \n\n**六组已知关系：**\n\n1. 已知 A、B → X=B-A, R=X/A\n    \n2. 已知 A、X → B=A+X, R=X/A\n    \n3. 已知 B、X → A=B-X, R=X/A（用415或假设分配）\n    \n4. 已知 B、R → 用**415份数法**或**假设分配**求A、X\n    \n5. 已知 A、R → X=AR, B=A+AR\n    \n6. 已知 X、R → A=X/R, B=A+X\n    \n\n### 1.2 同比与环比\n\n|类型|含义|示例|\n|---|---|---|\n|**同比**|与上年同期相比|2023年12月 vs 2022年12月|\n|**环比**|与上一相邻统计周期相比|2023年12月 vs 2023年11月|\n\n### 1.3 百分数与百分点\n\n\u003e **[注意]** 百分数（%）通过数值相除得到，用于比重、增长率。百分点通过百分数相减得到，用于两个增长率/比重的差值。 例：比重从48%变为52%，上升了 **4个百分点**（不是4%）。\n\n### 1.4 增速变化的表述\n\n|表述|去年增速计算|\n|---|---|\n|今年增长率10%，增幅**扩大/上升**5个百分点|10%-5% = **5%**|\n|今年增长率10%，增幅**缩小/下降**5个百分点|10%+5% = **15%**|\n|今年增长率-10%，增速**扩大**5个百分点|-10%-5% = **-15%**|\n|今年增长率-10%，增速**缩小**5个百分点|-10%+5% = **-5%**|\n|今年增长率-10%，**降幅扩大**5个百分点|-(10%-5%) = **-5%**|\n|今年增长率-10%，**降幅收窄**5个百分点|-(10%+5%) = **-15%**|\n\n\u003e **[易错]** \"降幅扩大\"和\"降幅收窄\"的主体是\"降幅\"（绝对值），方向与普通表述相反！降幅扩大意味着负得更多。\n\n### 1.5 倍数与增长率\n\n\u003e **倍数与增长率互换**\n\u003e \n\u003e - 增长了 1.5 倍 = 增长率为 150%\n\u003e     \n\u003e - A 比 B 增长了 60% → A 是 B 的 1.6 倍\n\u003e     \n\u003e - 1 倍 = 100%\n\u003e     \n\u003e - A 是 B 的多少倍：`A/B`\n\u003e     \n\u003e - A 比 B 多多少倍：`A/B - 1`\n\u003e     \n\n\u003e **[审题陷阱]** \"是多少倍\"和\"多多少倍\"相差1！城镇消费品零售额约是乡村的6.5倍，则城镇比乡村**多约5.5倍**。\n\n### 1.6 常用分数-百分数对照表\n\n\u003e **必须熟记**\n\u003e \n\u003e |百分数|分数|百分数|分数|百分数|分数|\n\u003e |---|---|---|---|---|---|\n\u003e |50%|1/2|16.7%|1/6|28.6%|2/7|\n\u003e |33.3%|1/3|14.3%|1/7|42.9%|3/7|\n\u003e |25%|1/4|12.5%|1/8|66.7%|2/3|\n\u003e |20%|1/5|11.1%|1/9|9.1%|1/11|\n\n---\n\n## 二、速算技巧\n\n### 2.1 加法技巧\n\n**尾数法**：多个数字精确求和且选项末尾数字不同时，从尾数入手，一般观察两位。\n\n\u003e **[注意]** 选项是\"4.9万\"\"2.1万\"形式时不能用尾数法（后面数字可能被约掉）。\n\n**高位叠加法**：从高位加起（与竖式相反），抓住主要矛盾。适用于非精确求和。\n\n### 2.2 减法技巧 - 分段法\n\n将多位数减法分成两段，尽可能不用借位；若无法避免借位，用负数代替。\n\n\u003e **[方法]**\n\u003e \n\u003e - 512-481 → 51-48=3, 2-1=1 → 结果 31\n\u003e     \n\u003e - 721-688 → 基准值法：721-700+700-688=21+12=33\n\u003e     \n\u003e - 1723-494 → 17-4=13, 23-94=-71 → 1300-71=1229\n\u003e     \n\n\u003e **[技巧] 前三位减法判断增量：** 若前三位相减已大于目标值→一定超过；等于→看后两位是否够减；小于→一定不够。\n\n### 2.3 乘法技巧\n\n**小分互换法**：将百分数乘数转化为常见分数。\n\n\u003e `784 × 25% = 784 × 1/4 = 196` `632 × 12.5% = 632 × 1/8 = 79`\n\n**乘法拆分法**：将百分数拆成两个简单数值之和/差。\n\n\u003e 常用拆分：`55%=50%+5%` | `48%=50%-2%` | `97%=100%-3%` | `103%=100%+3%`\n\n**乘法放缩法**：将乘数拆为整百×(1±小百分比)。\n\n\u003e 例：`212×332 = 212×300×(1+10.7%) ≈ 63600+6800 ≈ 70500`\n\n### 2.4 除法技巧\n\n**拆分法（除法核心）**：对直除的优化，借助选项\"猜\"出答案。\n\n\u003e **[三类拆分]**\n\u003e \n\u003e 1. 分子在分母50%附近 → 先拆出50%\n\u003e     \n\u003e 2. 分数约等于1 → 先拆出100%\n\u003e     \n\u003e 3. 分子很小 → 拆出10%、5%或1%\n\u003e     \n\n示例：`250÷484 = (242+8)/484 = 50%+ → 约52%`\n\n**除法放缩**：分子分母同比例扩大或缩小，分式不变。适用于分母接近整百时。\n\n\u003e 例：`858/981 → (858+17)/(981+19) = 875/1000 = 87.5%`\n\n\u003e **[积累] 除法分类：** 求A/X → 415/假设分配；比重（部分/整体）→ 拆分法；平均数/倍数 → 直除。\n\n### 2.5 415份数法\n\n\u003e **415份数法核心**\n\u003e \n\u003e 若 `R = 1/n`，则：\n\u003e \n\u003e - 基期 A = n 份，变化量 X = 1 份，现期 B = (n+1) 份\n\u003e     \n\u003e - `X = B / (n+1)`，`A = B × n / (n+1)`\n\u003e     \n\n示例：B=642，R=25%=1/4 → 份数 4、1、5 → X=642/5=128.4\n\n\u003e **[注意]**\n\u003e \n\u003e - 增长率为负时变为\"4(-1)3\"，X为负\n\u003e     \n\u003e - R近似为分数时，\"估大则一份变大，估小则一份变小\"\n\u003e     \n\u003e - 增长率\u003e10%、选项差距\u003e2%时最适用\n\u003e     \n\n### 2.6 误差修正法\n\n\u003e **误差修正步骤**\n\u003e \n\u003e 1. 将 R 近似为 1/n，用份数法求 X'\n\u003e     \n\u003e 2. `R差 = R实际 - R使用`\n\u003e     \n\u003e 3. `X = X' × (1 ± R修)` （R实际\u003eR使用时加，反之减）\n\u003e     \n\n**R修系数表：**\n\n|近似分数|适用范围|X'|R修|\n|---|---|---|---|\n|1/9 (11.1%)|10%~11.8%|B/10|R差×8|\n|1/8 (12.5%)|11.8%~13.4%|B/9|R差×7|\n|1/7 (14.3%)|13.4%~15.5%|B/8|R差×6|\n|1/6 (16.7%)|15.5%~18.5%|B/7|R差×5|\n|1/5 (20%)|18.5%~22.5%|B/6|R差×4|\n|1/4 (25%)|22.5%~30%|B/5|R差×3|\n|1/3 (33.3%)|30%~40%|B/4|R差×2.2|\n|1/2 (50%)|40%~60%|B/3|R差×1.3|\n|2/3 (66.7%)|60%~80%|B×0.4|R差×0.9|\n|1 (100%)|80%~120%|B/2|R差×0.5|\n\n\u003e **[积累]** 20%以内假设分配有优势，20%以上误差修正法有优势，差别不大，可根据习惯选择。\n\n### 2.7 假设分配法\n\n\u003e **假设分配核心**\n\u003e \n\u003e - 公式：`X = A × R`\n\u003e     \n\u003e - 核心思想：\"抓大放小\"，大数分完后小数有误差也不影响\n\u003e     \n\u003e - 步骤：确定分配数 → 画出分配树 → 逐步分配\n\u003e     \n\n**最后一步分配规则：**\n\n|R 大小|方法|\n|---|---|\n|R ≤ 25%|用被分配数的10%、20%修正|\n|R ≈ 33%|X = B/4|\n|R ≈ 50%|X = B/3|\n|R ≈ 66%|X = 0.4B|\n|R \u003e 80%|X = B/2|\n\n**选项极近时的假设思维**：选取选项间中间值X'代入，A'=B-X'，再算X=A'×R验证。\n\n---\n\n## 三、ABRX 高频考点\n\n### 3.1 基期（A）\n\n**一般基期**：代入法、直除法、假设分配法。\n\n**间隔基期**：\n\n\u003e **间隔基期公式**\n\u003e \n\u003e `间隔增长率 R = R1 + R2 + R1×R2` `基期 A = 现期 / (1 + R)`\n\n**基期和差**：分别用假设分配求两个基期，再求和或差。\n\n**已知变化情况求基期**：\n\n\u003e `A = X / R`（已知增量X和增长率R时使用）\n\n### 3.2 现期（B）\n\n- **假设增量求后期**：求X，列不等式 `B = A + nX \u003e 目标值`\n    \n- **假设增速求后期**：`B = A + AR` 逐年推算\n    \n- **按实际增长率求后期**：\n    \n\n\u003e `按基期价格计算的现期 = 现期 / (1+名义R) × (1+实际R)`\n\n### 3.3 增长量（X）\n\n- **一般增长量**：X = B - A 或用415/假设分配\n    \n- **两期增长量的比值**：分别求X1、X2再求比\n    \n- **各部分增量之和 = 总增量**：\n    \n\n\u003e `X其他 = X总 - X1 - X2 - ...`\n\n### 3.4 增长率（R）\n\n**一般增长率**：`R = X/A = (B-A)/A`\n\n**间隔增长率**：\n\n\u003e `R = R1 + R2 + R1 × R2`\n\u003e \n\u003e R1×R2 在两者都较小时可忽略；一大一小时取\"小正数\"\n\n**间隔增长率逆运用**：已知间隔R和一年R1，求另一年 `R2 ≈ R - R1`\n\n**比值增长率（平均数增长率）**：\n\n\u003e **比值增长率公式**\n\u003e \n\u003e A = B/C，B增长率R1，C增长率R2\n\u003e \n\u003e `A的增长率 = (R1 - R2) / (1 + R2)`\n\u003e \n\u003e 比值倍数 = 比值增长率 + 100%\n\n题型识别：人均收入、平均分、单位面积产量等。\n\n**乘积增长率**：\n\n\u003e **乘积增长率公式**\n\u003e \n\u003e A = B × C，B增长率R1，C增长率R2\n\u003e \n\u003e `R = R1 + R2 + R1 × R2`\n\n常见场景：\n\n- 总产量 = 亩产 × 面积\n    \n- 总销额 = 销量 × 单价\n    \n- **部分 = 整体 × 占比**（有占比想乘积！）\n    \n\n### 3.5 年均增长量\n\n\u003e **年均增量 = (末期 - 基期) / n**\n\n|问法|基期是否前推|计算|\n|---|---|---|\n|\"十三五\"时期(2016-2020)|要推（用2015年）|(2020值-2015值)/5|\n|2016年到2020年这五年|要推|(2020值-2015值)/5|\n|2015-2020年（图表从2015起）|不推|(2020值-2015值)/5|\n\n\u003e **[易错]** \"十三五时期\"等五年规划说法，基期必须前推一年。图表已有第一年且从该年问起则不推。\n\n### 3.6 年均增长率\n\n\u003e **(1 + r)^n = 末期 / 基期**\n\u003e \n\u003e 近似：`末期/基期 ≥ 1 + nr`（r 极小时）\n\n**需记住的幂次值：**\n\n|值|结果|\n|---|---|\n|1.05^4|1.22|\n|1.1^4|1.46|\n|1.15^4|1.75|\n|1.2^4|2.07|\n\n**假设年均增速相同求后期**：\n\n\u003e `第2n年值 = 末期² / 基期值`\n\n---\n\n## 四、比重类\n\n### 4.1 现期比重\n\n\u003e **现期比重公式组**\n\u003e \n\u003e - `比重 = 部分 / 整体`\n\u003e     \n\u003e - `部分 = 整体 × 比重`\n\u003e     \n\u003e - `整体 = 部分 / 比重`\n\u003e     \n\u003e - `比重和（差）= 部分和（部分差）/ 整体`\n\u003e     \n\n\u003e **[方法] 饼状图技巧：** 利用1/2、1/3、1/4、1/8等特殊比例判断。从12点钟方向顺时针依次排列。\n\n### 4.2 基期比重\n\n\u003e **基期比重公式**\n\u003e \n\u003e `基期比重 = 现期比重 × (1+整体R) / (1+部分R)`\n\u003e \n\u003e 口诀：基期比重 = 现期比重 × \"1+增长率反过来\"\n\n\u003e **[积累]** 基期平均值、基期倍数、基期比值均可视为\"基期比重\"，用同一公式。\n\n### 4.3 隔级比重\n\n存在大集合、中集合、小集合的层级关系。\n\n\u003e `隔级比重 = 小集合/中集合 × 中集合/大集合`\n\n### 4.4 比重趋势\n\n\u003e **比重趋势判断**\n\u003e \n\u003e - 部分增速R1 \u003e 整体增速R2 → **比重上升**\n\u003e     \n\u003e - 部分增速R1 \u003c 整体增速R2 → **比重下降**\n\u003e     \n\n**比重趋势多一步**：已知本期比重和趋势方向，反推前期比重。\n\n**比重趋势逆运用**：已知比重变化方向 → 推断部分增速与整体增速的大小关系。\n\n### 4.5 比重差\n\n\u003e **比重差公式**\n\u003e \n\u003e `比重差 = (前期部分 / 本期整体) × (部分R - 整体R)`\n\u003e \n\u003e 记忆：今年整体分之去年部分 × 增长率之差\n\n\u003e **[方法] 比重差秒杀计：** 比重差的绝对值 **小于** 增速差的绝对值！\n\n**比值差**：可套用比重差公式，但**不可以秒杀**（量级不一定小于增速差）。\n\n\u003e **[注意]** 比重差选项单位多为\"百分点\"；比值增长率单位为\"%\"；比值差选项带实际含义单位。\n\n---\n\n## 五、盐水类（混合思维）\n\n### 5.1 盐水思想核心\n\n\u003e **混合规律**\n\u003e \n\u003e 混合比值在两部分比值之间，且**靠近分母更大的一部分**\n\n适用场景：\n\n- 整体增长率 = 进口R与出口R的混合\n    \n- 累计增长率 = 当月R与上月累计R的混合\n    \n- 全年R = 上半年R与下半年R的混合\n    \n- 全国人均收入 = 城镇与农村人均的混合\n    \n\n### 5.2 十字交叉法\n\n\u003e **十字交叉模型**\n\u003e \n\u003e A部分增长率 a          |r - b|  \n\u003e           混合增长率 r  \n\u003e B部分增长率 b          |a - r|  \n\u003e ​  \n\u003e A/B = |r-b| / |a-r|\n\n\u003e **[注意]** 十字交叉求得的是**基期之比**。分母是什么，求的就是什么之比。\n\n### 5.3 线段法\n\n画线标点、按比例分段、按量选点、几何计算。**量与距离成反比**。\n\n### 5.4 三类盐水考法\n\n**① 三浓度排序**\n\n\u003e **部分1浓度 \u003e 整体浓度 \u003e 部分2浓度**\n\n典型应用：已知1-5月和1-6月增速，判断6月增速。\n\n**② 已知3R求量之比**：代入十字交叉求得基期量之比。\n\n**③ 已知2R和量之比求第三R**：先定性（在中间不在正中间），再定量计算。\n\n---\n\n## 六、比较类\n\n### 6.1 常用比较方法\n\n|方法|适用场景|\n|---|---|\n|**趋势法**|借用比重趋势：分子增速\u003e分母→分数变大|\n|**通分法**|分子或分母换算同样大小后比较|\n|**\"王者荣耀\"法**|盐水思想拆分分子分母判断大小|\n|**双线法**|增速大小比较，标注增量X直观比较|\n\n### 6.2 替代比较技巧\n\n\u003e **[方法] 四种替代思路（提速关键）**\n\u003e \n\u003e 1. 用**末期/基期**代替年均增长率比较（省去开方）\n\u003e     \n\u003e 2. 用**倍数B/A**代替增速(B/A-1)比较（省去减1）\n\u003e     \n\u003e 3. 用**部分A/部分非A**代替部分A/整体比较\n\u003e     \n\u003e 4. 用**X/B**代替X/A比较增长率\n\u003e     \n\n### 6.3 增量大小比较\n\n\u003e **增量比较秒杀计**\n\u003e \n\u003e ① B越大 R越大 → X越大（大大则大） ② 一大一小看倍数\n\n**追及问题**：顺差=出口-进口，出口增量\u003e进口增量→顺差增大。\n\n### 6.4 特殊比较\n\n- **超过某数值**：将增量拆成10%和剩余部分判断\n    \n- **折线图**：先确定增减方向，再比较相对大小\n    \n\n---\n\n## 七、平均数与倍数\n\n### 7.1 平均数\n\n\u003e **平均数 = 总数A / 个数B**\n\u003e \n\u003e 识别：\"均\"\"每\"\"单位\" → 均前每后做分母\n\n题型全览：\n\n1. 求单个平均数\n    \n2. 两个平均数之比：`A/B ÷ C/D = AD/BC`\n    \n3. 基期平均数（同基期比重公式）\n    \n4. 平均数变化趋势（同比重趋势）\n    \n5. 平均数差值（同比值差公式）\n    \n6. 平均数增长率（同比值增长率）\n    \n\n\u003e **[注意]** 时间平均数注意闰年366天、季度个数、大小月。\n\n### 7.2 倍数\n\n\u003e **倍数公式组**\n\u003e \n\u003e - A是B的多少倍：`A/B`\n\u003e     \n\u003e - A比B多多少倍：`A/B - 1`\n\u003e     \n\u003e - 基期倍数 = `现期倍数 × (1+R2)/(1+R1)`\n\u003e     \n\u003e - 翻n番：A是B的 `2^n` 倍\n\u003e     \n\u003e - 间隔倍数 = 间隔增长率 + 100%\n\u003e     \n\n---\n\n## 八、特殊考点\n\n### 8.1 拉动增长与增量贡献率\n\n\u003e **拉动增长与贡献率**\n\u003e \n\u003e - `拉动增长 = 部分增量 / 整体前期（基期）`\n\u003e     \n\u003e - `增量贡献率 = 部分增量 / 整体增量`\n\u003e     \n\n\u003e **[方法]** 比较不同部分对同一整体的贡献率时，整体增量相同，只需比较部分增量大小。\n\n### 8.2 容斥问题\n\n\u003e **[方法] 容斥四步法**\n\u003e \n\u003e 1. 判断有无交集：占比之和超过100% → 一定有交集\n\u003e     \n\u003e 2. 求至少（最小交集）：`a + b - 100%`\n\u003e     \n\u003e 3. 求至多（最大交集）：取占比较少项的比重\n\u003e     \n\u003e 4. 既A又B的范围：在\"至少\"和\"至多\"之间\n\u003e     \n\n---\n\n## 九、易错点与思维陷阱\n\n### 9.1 比较/计数类陷阱\n\n|序号|陷阱|说明|\n|---|---|---|\n|①|**时间范围**|问\"2011~2020年\"则2010年不要算|\n|②|**合计/总计行**|\"全国\"\"合计\"行不要当独立项计数|\n|③|**首年增量**|首年增量需用增长率求，后面用X=B-A|\n|④|**单位**|注意不同指标单位差异（万吨vs亿吨）|\n|⑤|**排序方向**|确认从高到低还是从低到高|\n|⑥|**图表列举不全**|图表可能只列出部分省市|\n|⑦|**时间不匹配**|1~7月数据推不出全年|\n\n### 9.2 审题陷阱\n\n|序号|陷阱|说明|\n|---|---|---|\n|⑧|**同比/环比混淆**|同比=去年同期，环比=前一周期|\n|⑨|**\"是多少倍\"vs\"多多少倍\"**|二者差1|\n|⑩|**比重分母**|看清占谁的比重，隔级需转换|\n|⑪|**进出口主客颠倒**|欧盟从我国进口=我国对欧盟出口|\n|⑫|**累计与当期**|8月累计=1~8月总和，非8月当月|\n|⑬|**月均遗漏**|问1~8月月均增量要÷8|\n|⑭|**一二月合并**|无法单独确定1月或2月值|\n\n### 9.3 做题策略\n\n\u003e **[积累] 实战建议**\n\u003e \n\u003e - 建\"坑本\"记录掉过的坑，考前翻阅\n\u003e     \n\u003e - 综合分析题先查找比较再计算，避免反复读题\n\u003e     \n\u003e - 选项差距大时用估算（415/拆分），极近时用精确计算或选项代入法\n\u003e     \n\u003e - 查找数据时注意整体和部分的位置关系，避免看错行\n\u003e     \n\n---\n\n_笔记整理自花生13（四海公考）25下半年资料分析课程全部内容_"])</script><script>self.__next_f.push([1,"d:[]\n"])</script><script>self.__next_f.push([1,"0:[\"$\",\"$L2\",null,{\"buildId\":\"50VDBHGkjYXbDFI7cl-qI\",\"assetPrefix\":\"\",\"urlParts\":[\"\",\"blog\",\"\"],\"initialTree\":[\"\",{\"children\":[\"blog\",{\"children\":[\"__PAGE__\",{}]}]},\"$undefined\",\"$undefined\",true],\"initialSeedData\":[\"\",{\"children\":[\"blog\",{\"children\":[\"__PAGE__\",{},[[\"$L3\",[\"$\",\"$L4\",null,{\"posts\":[{\"slug\":\"new-notes\",\"frontmatter\":{\"title\":\"未命名\",\"titleEn\":\"new notes\",\"date\":\"2026-06-08\",\"tags\":[\"个人主页\"],\"excerpt\":\"这是我的第一篇学习笔记\",\"excerptEn\":\"$undefined\",\"draft\":false},\"content\":\"$5\"},{\"slug\":\"花生13（四海公考）言语理解模块 - 完整学习笔记\",\"frontmatter\":{\"title\":\"未命名\",\"titleEn\":\"\",\"date\":\"2026-06-08\",\"tags\":[\"null\"],\"excerpt\":\"本笔记整理自花生13言语理解模块全部课程资料，按知识点/方法论组织，不按讲次排列。适用于考前系统复习。\",\"excerptEn\":\"$undefined\",\"draft\":false},\"content\":\"$6\"},{\"slug\":\"花生十三 - 数量关系学习笔记\",\"frontmatter\":{\"title\":\"未命名\",\"titleEn\":\"\",\"date\":\"2026-06-08\",\"tags\":[\"null\"],\"excerpt\":\"来源： 四海公考 25下半年（花生十三）数量关系模块 22讲精华 整理方式： 按知识点/题型方法论组织，融合所有讲次，不保留原题\",\"excerptEn\":\"$undefined\",\"draft\":false},\"
